<style>
:root{
  --bg:#f3f5f9; --bg2:#eaeef5; --card:#ffffff; --text:#14213d; --muted:#64708a; --border:#e2e7ef; --line:#eef1f6;
  --primary:#2f55d4; --primary-2:#4b6ff0; --primary-soft:#e9eefd; --on-primary:#fff;
  --green:#0f8a5f; --green-soft:#e3f5ec; --red:#c8401a; --red-soft:#fdebe4; --amber:#a2650a; --amber-soft:#fcf2da;
  --purple:#6b3fd0; --purple-soft:#f0eafc; --gold:#c9a24a;
  --side:#0e1a33; --side-2:#13254a; --side-text:#c6d0e6; --side-muted:#7f8db0; --side-on:#ffffff; --side-hover:rgba(255,255,255,.07); --side-active:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 10px 30px rgba(16,24,40,.12);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220; --bg2:#111a2c; --card:#141d30; --text:#e7ecf6; --muted:#93a0bb; --border:#24314b; --line:#1c2740;
    --primary:#7b98ff; --primary-2:#90a8ff; --primary-soft:#1b2747; --on-primary:#0c1220;
    --green:#4fd19a; --green-soft:#12302a; --red:#ff8d66; --red-soft:#3a2119; --amber:#f0bd55; --amber-soft:#342a14;
    --purple:#b69bff; --purple-soft:#271f45;
    --side:#080d18; --side-2:#0d1527;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --bg2:#111a2c; --card:#141d30; --text:#e7ecf6; --muted:#93a0bb; --border:#24314b; --line:#1c2740;
  --primary:#7b98ff; --primary-2:#90a8ff; --primary-soft:#1b2747; --on-primary:#0c1220;
  --green:#4fd19a; --green-soft:#12302a; --red:#ff8d66; --red-soft:#3a2119; --amber:#f0bd55; --amber-soft:#342a14;
  --purple:#b69bff; --purple-soft:#271f45;
  --side:#080d18; --side-2:#0d1527;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Heebo","Assistant",Arial,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--primary-soft)}

/* ---------- מבנה: תפריט צד + תוכן ---------- */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:264px;flex:0 0 264px;background:linear-gradient(180deg,var(--card) 0%,color-mix(in srgb,var(--primary) 3%,var(--card)) 100%);color:var(--text);border-inline-start:1px solid var(--border);box-shadow:-4px 0 24px rgba(16,24,40,.04);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{flex:0 0 44px;width:44px;height:44px;border-radius:50%;filter:drop-shadow(0 3px 6px rgba(22,41,90,.3))}
.hero .biglogo{float:left;width:150px;height:150px;margin:-8px 0 8px 18px;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media(max-width:700px){.hero .biglogo{float:none;display:block;margin:0 auto 14px;width:120px;height:120px}}
.brand .t{font-size:21px;font-weight:800;color:var(--text);letter-spacing:-.2px;line-height:1.1}
.brand .s{font-size:12px;color:var(--muted);margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11.5px;font-weight:700;color:var(--muted);padding:14px 12px 6px;letter-spacing:.3px;opacity:.85}
nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--text);padding:9px 12px;border-radius:11px;font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;text-align:right;width:100%;transition:background .15s,color .15s}
nav button svg{width:19px;height:19px;flex:0 0 19px;color:var(--muted)}
nav button:hover{background:var(--bg)}
nav button:hover svg{color:var(--primary)}
nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:700;box-shadow:inset -3px 0 0 var(--primary)}
nav button.on svg{color:var(--primary)}
.side-foot{margin-top:auto;padding-top:14px}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--green);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 22%,transparent);padding:10px 12px;border-radius:12px}
.lock svg{flex:0 0 18px;margin-top:1px}
.theme{margin-top:10px;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px}
.theme button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:6px 4px;border-radius:8px;cursor:pointer}
.theme button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.3px}
.topbar .sub{font-size:13px;color:var(--muted)}
.topbar .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--border);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;align-items:center;justify-content:center}
main{max-width:1180px;width:100%;margin:0 auto;padding:22px 28px 60px}
.scrim{display:none}

/* ---------- כרטיסים ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:16.5px;margin:0 0 14px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14.5px;margin:18px 0 8px;font-weight:700}
.card > p:last-child{margin-bottom:0}
details.card > summary{list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::before{content:"◂";display:inline-block;margin-left:8px;transition:transform .2s;color:var(--muted)}
details.card[open] > summary::before{transform:rotate(-90deg)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid > div > .card:last-child{margin-bottom:0}
.grid > .card{margin-bottom:0}
.grid + .grid, .grid + .card, .card + .grid{margin-top:0}
main > .grid{margin-bottom:18px;align-items:start}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow);max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.two > .card{margin-bottom:0}

/* מספרים בולטים */
.stat{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 15px;box-shadow:var(--shadow);overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--primary);opacity:.85}
.stat:has(.val.pos)::before{background:var(--green)}
.stat:has(.val.neg)::before{background:var(--red)}
.card .stat{box-shadow:none;background:var(--bg)}
.card .stat::before{display:none}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:600}
.stat .val{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.2}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
ul,ol{padding-inline-start:22px} li{margin:4px 0}

/* בורר חודש */
.monthbar{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;width:fit-content;max-width:100%;box-shadow:var(--shadow)}
.monthbar .m{font-size:16px;font-weight:700;min-width:140px;text-align:center}
.monthbar .btn{border-color:transparent;background:transparent}
.monthbar .btn:hover{background:var(--bg)}
.monthbar .btn.primary{background:var(--primary);color:var(--on-primary)}

/* ---------- כפתורים ---------- */
button.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:0 16px;height:40px;border-radius:11px;cursor:pointer;font-size:14.5px;font-weight:600;font-family:inherit;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;white-space:nowrap}
button.btn:hover,label.btn:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));background:color-mix(in srgb,var(--primary) 4%,var(--card))}
button.btn:active,label.btn:active{transform:translateY(1px)}
button.btn.primary,label.btn.primary{background:linear-gradient(180deg,var(--primary-2),var(--primary));border-color:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(47,85,212,.25),0 4px 12px rgba(47,85,212,.18)}
button.btn.primary:hover,label.btn.primary:hover{filter:brightness(1.06)}
button.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
button.btn.danger:hover{background:var(--red-soft)}
button.btn.sm,label.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
button.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
button.x:hover{color:var(--red);background:var(--red-soft)}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}

/* ---------- טפסים ---------- */
input,select{font-family:inherit;font-size:14.5px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}
input:focus,select:focus{border-color:var(--primary)}
input[type=checkbox]{width:18px;height:18px;height:18px;padding:0;vertical-align:middle;accent-color:var(--primary)}
input[type=number]{font-variant-numeric:tabular-nums}
select{padding-left:30px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.form{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}

/* ---------- טבלאות ---------- */
.tablewrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px;background:var(--bg);white-space:nowrap}
tr:first-child th:first-child{border-start-start-radius:10px} tr:first-child th:last-child{border-start-end-radius:10px}
tr:last-child td{border-bottom:0}
tbody tr:hover td, table tr:hover td{background:color-mix(in srgb,var(--primary) 3%,transparent)}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
td select{height:32px;font-size:13px;padding:0 8px 0 26px;max-width:200px;background-position:10px 50%,15px 50%}
td input[type=number]{height:32px}
table.cover td.cv, table.cover th.cv{text-align:center;padding:7px 4px;font-size:12px;min-width:46px}
table.cover td.cv{border-left:2px solid var(--card)}
td.cv.ok{background:var(--green-soft)!important;color:var(--green);font-weight:800}
td.cv.miss{background:var(--red-soft)!important;color:var(--red);font-weight:600}
td.cv.warn{background:var(--amber-soft)!important;color:var(--amber);font-weight:600}

/* ---------- גרפים ---------- */
.bars .b{margin:12px 0}
.bars .bl{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bars .bt{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bars .bf{height:100%;background:linear-gradient(270deg,var(--primary-2),var(--primary));border-radius:99px}
.mini{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:12px}
.mini .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mini .pair{display:flex;gap:4px;align-items:flex-end;height:115px}
.mini .pair div{width:14px;border-radius:6px 6px 2px 2px;min-height:2px}
.mini .in{background:var(--green)} .mini .out{background:var(--red)}
.mini .ml{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* ---------- הודעות ---------- */
.tip{border-radius:12px;padding:12px 14px;margin:10px 0;border:1px solid var(--border);border-inline-start:4px solid var(--muted);background:var(--bg)}
.tip.warn{background:var(--amber-soft);border-color:transparent;border-inline-start-color:var(--amber)}
.tip.bad{background:var(--red-soft);border-color:transparent;border-inline-start-color:var(--red)}
.tip.good{background:var(--green-soft);border-color:transparent;border-inline-start-color:var(--green)}
.tip.info{background:var(--primary-soft);border-color:transparent;border-inline-start-color:var(--primary)}
.tip > b{display:block;margin-bottom:3px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--purple-soft);color:var(--purple);font-weight:600}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--primary-soft);color:var(--primary)}
.step.done .n{background:var(--green-soft);color:var(--green)}
.step.now .n{background:var(--amber);color:#fff;box-shadow:0 0 0 4px var(--amber-soft)}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* הסברים */
.guide{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--primary-soft),color-mix(in srgb,var(--primary-soft) 40%,var(--card)));border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.guide .gi{font-size:22px;line-height:1}
.guide b{display:block;margin-bottom:2px}
.guide ul{margin:4px 0 0;font-size:14px;color:var(--muted)}
.guide li{margin:2px 0}
button.info{border:0;background:none;color:var(--primary);cursor:pointer;font-size:14px;padding:0 5px;vertical-align:1px;opacity:.75;font-family:inherit}
button.info:hover{opacity:1}
.explain{font-size:13px;color:var(--text);background:var(--primary-soft);border-radius:10px;padding:8px 11px;margin:6px 0 8px;line-height:1.5;font-weight:400}
.card > .explain{margin-top:-6px}
/* מסך פתיחה */
.hero{background:radial-gradient(1200px 300px at 100% 0%,color-mix(in srgb,var(--gold) 18%,transparent),transparent),linear-gradient(135deg,#16295a 0%,#2f55d4 100%);color:#fff;border-radius:20px;padding:34px 30px;margin-bottom:18px;box-shadow:var(--shadow-lg)}
.txnote{font-size:12.5px;color:var(--primary);margin-top:2px}
.txnote::before{content:'↳ '}
.stat .ico{position:absolute;inset-inline-end:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.stat .ico svg{width:18px;height:18px}
.stat .ico.g{background:var(--green-soft);color:var(--green)}
.stat .ico.r{background:var(--red-soft);color:var(--red)}
.stat .ico.p{background:var(--purple-soft);color:var(--purple)}
body:not(.help) .hint{display:none}
[data-act=helpshow].on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
details.rowmenu{position:relative;display:inline-block}
details.rowmenu summary{list-style:none;cursor:pointer;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1;user-select:none}
details.rowmenu summary::-webkit-details-marker{display:none}
details.rowmenu summary:hover,details.rowmenu[open] summary{background:var(--bg2);color:var(--text)}
details.rowmenu .menu{position:fixed;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:230px;display:flex;flex-direction:column}
details.rowmenu .menu button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--text);white-space:nowrap}
details.rowmenu .menu button:hover{background:var(--bg)}
details.rowmenu .menu button.danger{color:var(--red)}
details.rowmenu .menu button.danger:hover{background:var(--red-soft)}
.mob{display:none}
@media (max-width:640px){
  .txtable,.txtable tbody{display:block}
  .txtable tr:first-child{display:none}
  .txtable tr{display:grid;grid-template-columns:auto 1fr 1fr auto;grid-template-areas:"desc desc amt menu" "date own cat cat" "ex ex ex ex";gap:6px 8px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
  .txtable tr:has(td[colspan]){display:block;padding:0}
  .txtable td{border:0;padding:0;background:none!important}
  .txtable td:nth-child(1){grid-area:date;color:var(--muted)}
  .txtable td:nth-child(2){grid-area:desc;font-weight:600}
  .txtable td:nth-child(3){grid-area:own}
  .txtable td:nth-child(4){grid-area:cat}
  .txtable td:nth-child(5){grid-area:amt;font-size:15px}
  .txtable td:nth-child(6){grid-area:ex}
  .txtable td:nth-child(6):empty{display:none}
  .txtable .mob{display:inline;font-size:13px;color:var(--muted)}
  .txtable td:nth-child(7){grid-area:menu}
  .txtable td select{max-width:100%;width:100%}
}
.ownpick{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ownpick b{font-size:16px}
.ownpick .seg{margin:0}
.linkbtn{all:unset;cursor:pointer;font-size:12px;color:var(--muted);text-decoration:underline;margin-top:6px;display:inline-block}
.linkbtn:hover{color:var(--red)}
.bl-list{margin:0;padding:0;list-style:none;counter-reset:bl;display:flex;flex-direction:column;gap:8px}
.bl-list li{counter-increment:bl;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border-inline-start:4px solid var(--primary)}
.bl-list li::before{content:counter(bl);flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--card);color:var(--text)}
.bl-list li span{flex:1}
.bl-list li.good{border-color:var(--green)} .bl-list li.warn{border-color:var(--amber)} .bl-list li.bad{border-color:var(--red)}
.how{margin-top:6px;font-size:13.5px;color:var(--muted)}
.how summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:13px}
.how[open]{background:var(--card);border-radius:8px;padding:8px 10px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-inline-start:6px}
.chip.good{background:var(--green-soft);color:var(--green)} .chip.bad{background:var(--red-soft);color:var(--red)}
.mkt-form{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent)}
.mkt-form a{color:var(--primary)}
.mkt{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border:1px solid var(--border);border-radius:12px}
.mkt > div{flex:1;min-width:240px}
.mkt-n{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0;font-size:14px}
details.fold{margin-bottom:12px}
details.fold > summary{cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;font-weight:700;box-shadow:var(--shadow)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:'▾';float:left;color:var(--muted)}
details.fold[open] > summary{margin-bottom:12px}
details.fold[open] > summary::after{content:'▴'}
.merged{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.merged .lbl{font-weight:700;font-size:15px}
.merged .val{font-size:34px;font-weight:800;margin:4px 0}
.merged .val.neg{color:var(--red)}
.merged .sub{font-size:13px;opacity:.85}
.hero h2{font-size:26px;margin:0 0 8px;font-weight:800}
.hero p{color:#d6def0;max-width:640px;margin:0 0 18px}

/* ---------- טלפון ---------- */
@media (max-width:900px){
  .side{position:fixed;inset:0 0 0 auto;transform:translateX(100%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:25}
  .menu-btn{display:inline-flex}
  .topbar-in{padding:10px 16px}
  .topbar h1{font-size:18px}
  .topbar .sub{display:none}
  main{padding:16px 16px 50px}
  .card{padding:16px}
  .stat .val{font-size:23px}
  .topbar .acts .btn .lbl{display:none}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .grid:has(> .card), .grid:has(> div > .card){grid-template-columns:1fr}
  .stat{padding:12px 13px}
  .stat .val{font-size:20px}
  .monthbar{width:100%;justify-content:space-between}
  .monthbar .m{min-width:0}
}
</style>
</head>
<body>
<div class="app">

  MARKET.boiRate = o.boiRate; MARKET.inflation = o.inflation;

  MARKET.updated = o.date; MARKET.manual = true; MARKET.nextDecision = null;
  MARKET.headline = `ריבית בנק ישראל ${o.boiRate}%, אינפלציה ${o.inflation}% (עדכנת בעצמך ב-${fmtDate(o.date)}).`;
  MARKET.notes = [];
}

// אחרי עדכון של רשימת בתי העסק: מנסים שוב לסווג תנועות שנשארו "אחר" (לא נוגעים במה ששינית ידנית)
setTimeout(()=>{ let n = 0; db.tx.forEach(t=>{ if(t.category==='אחר' && !t.manualCat){ const c = guessCategory(t.description, t.type, t.srcCat, t.note); if(c!=='אחר'){ t.category = c; n++; } } }); if(n){ save(); render(); } }, 0);
function load(){

function migrate(d){
  d = Object.assign(emptyDb(), d);
  if(!Array.isArray(d.maaserRules)) d.maaserRules = [];
  if(!Array.isArray(d.goals)) d.goals = [];
  if(!d.budgets) d.budgets = {};
  if(!Array.isArray(d.annual)) d.annual = [];
  if(!Array.isArray(d.imports)) d.imports = [];
  if(!d.balances) d.balances = {};
  if(!Array.isArray(d.assets)) d.assets = [];
  if(!d.worth) d.worth = {};
  if(!Array.isArray(d.maaserManual)) d.maaserManual = [];
  if(!Array.isArray(d.xrules)) d.xrules = [];
  // תנועות שיובאו "ללא תיאור" עם פירוט: הפירוט עובר להיות התיאור, והן מסווגות מחדש
  (d.tx||[]).forEach(t=>{ if(t.description==='ללא תיאור' && t.note){ t.description = t.note; delete t.note; delete t.noteSrc; if(!t.manualCat && !t.splitOf) t.category = 'אחר'; } });
  // יתרה מקובץ של חשבון שאין לו אף תנועת בנק (למשל אחרי שמחקו ייבוא שנעשה לחשבון הלא נכון) לא נספרת פעמיים
  for(const [o,b] of Object.entries(d.balances)) if(b && b.src==='file' && !(d.tx||[]).some(t=>(t.owner||'משותף')===o && !t.card)) delete d.balances[o];
  d.settings = Object.assign(emptyDb().settings, d.settings||{});
  if(d.settings.people[1]==='אשתי'){ d.settings.people[1] = 'גילה'; (d.tx||[]).forEach(t=>{ if(t.owner==='אשתי') t.owner = 'גילה'; }); }
  if(d.exemptRules){ // גרסה ישנה: רק פטור / לא פטור
    for(const [m,ex] of Object.entries(d.exemptRules)) d.maaserRules.push({id:d.nextId++, match:m, kind:ex?'exempt':'normal'});
    delete d.exemptRules;
  }
  return d;
}

// ---------- עזרים ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const money = n => '₪' + nf.format(Math.round(n||0));
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const monthName = ym => { const [y,m] = ym.split('-'); return MONTHS[+m-1] + ' ' + y; };
const shortMonth = ym => { const [y,m] = ym.split('-'); return MONTHS[+m-1].slice(0,3) + "' " + y.slice(2); };
const ymOf = d => d.slice(0,7);
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a))/86400000);
function addMonths(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
const norm = s => String(s||'').toLowerCase().replace(/[0-9]/g,'').replace(/[^\p{L}\s"'&.-]/gu,' ').replace(/\s+/g,' ').trim();
function fmtDate(d){ const [y,m,dd] = d.split('-'); return dd+'/'+m+'/'+y.slice(2); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600); }

// מילות מפתח: מחפשים רק בתחילת מילה, כדי ש"מי " לא יתפוס את "לאומי "
function kwCat(text, type){
  const hay = ' ' + String(text||'').toLowerCase().replace(/[\u200e\u200f\u202a-\u202e\u00a0]/g,' ').replace(/[\-_/.,()'"]/g,' ') + ' ';
  for(const [cat, words] of (type==='income' ? INC_KW : EXP_KW)){
    if(words.some(w => hay.includes(' ' + w.toLowerCase().replace(/[\-_/.,()'"]/g,' ').replace(/^\s+/,'')))) return cat;
  }
  return null;
}
// note = הפירוט (ממי / למי). קודם מה שלימדת על השם הזה, אחר כך מילות מפתח בפירוט, ורק אז התיאור
function guessCategory(desc, type, srcCat, note){
  if(note){
    const nn = norm(note);
    if(nn && db.rules[type+'|n:'+nn]) return db.rules[type+'|n:'+nn];
    // העברה ביניכם (למשל מאוריאל לגילה) היא לא הכנסה ולא הוצאה
    if(db.settings.people.some(p=>p && p.length>1 && (' '+nn+' ').includes(' '+norm(p)+' '))) return 'העברה בין חשבונות (לא נספר)';
    const c = kwCat(note, type); if(c) return c;
  }
  const n = norm(desc);
  if(db.rules[type+'|'+n]) return db.rules[type+'|'+n];
  { const c = kwCat(desc, type); if(c) return c; }
  if(srcCat && type!=='income'){ const m = SRC_CAT_MAP.find(([re])=>re.test(srcCat)); if(m) return m[1]; }
  return 'אחר';
}
// אחרי שנוסף פירוט: מסווגים מחדש תנועה שלא שינית ידנית
function recat(t){
  if(t.manualCat || t.splitOf || t.category===CC_CAT) return false;
  if(findXRule(t) && findXRule(t).category){ return applyXRule(t); }
  const c = guessCategory(t.description, t.type, t.srcCat, t.note);
  if(c!=='אחר' && c!==t.category){ t.category = c; return true; }
  applyXRule(t); return false;
}
function guessExempt(desc, cat){ return EXEMPT_BY_DEFAULT.has(cat); }

// ---------- כללי מעשרות ----------
// kind: normal = האחוז הרגיל, pct = אחוז אחר, fixed = סכום קבוע מכל הכנסה כזו, exempt = פטור
function findMaaserRule(desc){
  const n = norm(desc); let best = null;
  for(const r of db.maaserRules){ const m = norm(r.match); if(m && n.includes(m) && (!best || m.length > norm(best.match).length)) best = r; }
  return best;
}
function maaserRuleFor(t){
  if(t.mk) return {kind:t.mk, value:t.mv, src:'manual'};
  const xr = findXRule(t); if(xr && xr.maaser) return {kind:xr.maaser, src:'rule'};
  const r = findMaaserRule(t.description+' '+(t.note||'')); if(r) return {kind:r.kind, value:r.value, src:'rule'};
  return {kind: t.exempt ? 'exempt' : 'normal', src:'auto'};
}
function txDue(t){
  const r = maaserRuleFor(t);
  if(r.kind==='exempt') return 0;
  if(r.kind==='pct') return t.amount * (+r.value||0) / 100;
  if(r.kind==='fixed') return +r.value||0;
  return t.amount * db.settings.maaserPct / 100;
}
function ruleText(r){
  return r.kind==='exempt' ? 'פטור' : r.kind==='pct' ? (+r.value)+'%' : r.kind==='fixed' ? money(r.value)+' קבוע' : 'רגיל ('+db.settings.maaserPct+'%)';
}
// ---------- כללים קבועים (לפי תיאור, פירוט וסכום) ----------
// העברות בנקאיות מופיעות בקובץ בשם כללי ("הע. אינטרנט"), אז הסיווג שלהן לא נלמד אוטומטית לפי התיאור
const GENERIC_TX = /העברה|הע\.|העב |זיכוי|הפקדה|משיכה|שיק|צ'ק|bit|ביט|פייבוקס|paybox/i;
const isGeneric = t => GENERIC_TX.test(String(t.description||'')+' ');
function xRuleMatch(r, t){
  if(r.type!==t.type) return false;
  if(r.amount!=null && Math.abs(r.amount - (+(t.origAmount ?? t.amount))) > 0.005) return false;
  if(norm(r.text) && !norm(t.description+' '+(t.note||'')).includes(norm(r.text))) return false;
  return true;
}
function findXRule(t){
  let best = null, bs = -1;
  for(const r of db.xrules||[]){ if(!xRuleMatch(r,t)) continue; const sc = (r.amount!=null?1000:0) + norm(r.text).length; if(sc>bs){ best = r; bs = sc; } }
  return best;
}
function applyXRule(t, force){
  if(t.splitOf || t.origAmount!=null) return false;
  const r = findXRule(t); if(!r) return false;
  let ch = false;
  if(r.category && (force || !t.manualCat) && t.category!==r.category){ t.category = r.category; ch = true; }
  if(r.note && !t.note){ t.note = r.note; ch = true; }
  return ch;
}
function xRuleText(r){
  const parts = [];
  if(norm(r.text)) parts.push(`התיאור או הפירוט כולל "<b>${esc(r.text)}</b>"`);
  if(r.amount!=null) parts.push(`הסכום בדיוק <b>${money(r.amount)}</b>`);
  return (r.type==='income'?'הכנסה':'הוצאה') + ' ש' + parts.join(' ו');
}
function xRuleDo(r){
  const d = [];
  if(r.category) d.push(`קטגוריה: <b>${esc(r.category)}</b>`);
  if(r.note) d.push(`פירוט: <b>${esc(r.note)}</b>`);
  if(r.maaser) d.push(r.maaser==='exempt'?'פטור ממעשר':'מחשבים מעשר');
  return d.join(' · ');
}
function addTx(t){
  t.id = db.nextId++;
  t.amount = Math.abs(+t.amount);
  if(!t.category) t.category = guessCategory(t.description, t.type, t.srcCat, t.note);
  if(!t.manualCat) applyXRule(t);
  if(t.type==='income' && t.exempt===undefined) t.exempt = guessExempt(t.description, t.category);
  db.tx.push(t);
  return t;
}

// ---------- חישובים ----------
function monthsWithData(){ return [...new Set(db.tx.map(t=>ymOf(t.date)))].sort(); }
// חיוב חודשי של כרטיס אשראי בדף הבנק: אם אין פירוט מקובץ האשראי לחודש הזה, סופרים אותו כהוצאה כדי שלא יחסר כסף בחשבון
const CC_CAT = 'חיוב כרטיס אשראי (לא נספר)';
const CC_UNDETAILED = 'כרטיס אשראי (בלי פירוט)';
const cardBillMonth = t => t.billDate ? ymOf(t.billDate) : addMonths(ymOf(t.date), 1);
function cardCoveredMonths(){ const s = new Set(); db.tx.forEach(t=>{ if(t.card) s.add(cardBillMonth(t)); }); return s; }
function monthStats(ym){
  const covered = cardCoveredMonths();
  const r = {income:0, expense:0, savings:0, maaserBase:0, exemptIncome:0, maaserGiven:0, maaserDue:0, byCat:{}, incByCat:{}, tx:[]};
  for(const t of db.tx){
    if(ymOf(t.date)!==ym) continue;
    r.tx.push(t);
    if(t.category===CC_CAT && t.type==='expense' && !covered.has(ym)){ r.expense += t.amount; r.byCat[CC_UNDETAILED] = (r.byCat[CC_UNDETAILED]||0) + t.amount; continue; }
    if(NOT_COUNTED.has(t.category)) continue;
    if(t.type==='income'){
      r.income += t.amount;
      r.incByCat[t.category] = (r.incByCat[t.category]||0) + t.amount;
      if(maaserRuleFor(t).kind==='exempt') r.exemptIncome += t.amount; else r.maaserBase += t.amount;
      r.maaserDue += txDue(t);
    } else {
      if(t.category===SAVE_CAT){ r.savings += t.amount; continue; }
      r.expense += t.amount;
      r.byCat[t.category] = (r.byCat[t.category]||0) + t.amount;
      if(t.category===MAASER_CAT) r.maaserGiven += t.amount;
    }
  }
  // רישומים ידניים: תרומה במזומן (לא מופיעה בבנק) או תיקון ידני לחוב
  for(const x of db.maaserManual){ if(ymOf(x.date)!==ym) continue;
    if(x.kind==='given') r.maaserGiven += +x.amount; else r.maaserDue += +x.amount; }
  r.balance = r.income - r.expense - r.savings;
  return r;
}
function maaserTotals(){
  let base=0, given=0, dueInc=0;
  for(const t of db.tx){
    if(NOT_COUNTED.has(t.category)) continue;
    if(t.type==='income'){ if(maaserRuleFor(t).kind!=='exempt') base += t.amount; dueInc += txDue(t); }
    if(t.type==='expense' && t.category===MAASER_CAT) given += t.amount;
  }
  db.maaserManual.forEach(x=>{ if(x.kind==='given') given += +x.amount; else dueInc += +x.amount; });
  const due = dueInc + (+db.settings.maaserOpening||0);
  return {base, due, given, left: due-given};
}
// ממוצע של עד 3 החודשים האחרונים שיש בהם נתונים
function averages(){
  const ms = monthsWithData().slice(-3);
  if(!ms.length) return null;
  let inc=0, exp=0, sav=0;
  ms.forEach(m=>{ const s = monthStats(m); inc+=s.income; exp+=s.expense; sav+=s.savings; });
  return {months:ms.length, income:inc/ms.length, expense:exp/ms.length, savings:sav/ms.length, surplus:(inc-exp)/ms.length};
}

// ---------- התאמה בין הבנק לכרטיס האשראי ----------
function reconcileCard(){
  const bank = {}, card = {};
  db.tx.forEach(t=>{
    if(t.category===CC_CAT && t.type==='expense'){ const m = ymOf(t.date); bank[m] = (bank[m]||0) + t.amount; }
    if(t.card){ const m = cardBillMonth(t); card[m] = (card[m]||0) + (t.type==='expense' ? t.amount : -t.amount); }
  });
  const months = [...new Set([...Object.keys(bank), ...Object.keys(card)])].sort().slice(-8).reverse();
  if(!months.length) return '';
  const rows = months.map(m=>{
    const b = bank[m]||0, c = card[m]||0, diff = c - b;
    let st;
    if(b && !c) st = `<span class="neg">אין פירוט מהכרטיס. החיוב נספר כהוצאה כללית.</span> כדי לראות על מה הוצא, ייבא את קובץ האשראי של החודש.`;
    else if(c && !b) st = `<span class="muted">יש פירוט אבל עוד לא ראיתי את החיוב בבנק (אולי עוד לא ייבאת את דף הבנק, או שהחיוב עוד לא ירד).</span>`;
    else if(Math.abs(diff) <= Math.max(20, b*0.01)) st = `<span class="pos">✓ מתאים</span>`;
    else st = `<span class="neg">הפרש של ${money(Math.abs(diff))}</span>. ${diff<0?'ייתכן שחסר קובץ של כרטיס נוסף, או עסקאות בחו"ל שלא נכנסו.':'ייתכן שחלק מהעסקאות יחויבו בחודש אחר, או שיובאו פעמיים.'}`;
    return `<tr><td>${monthName(m)}</td><td class="num">${b?money(b):'—'}</td><td class="num">${c?money(c):'—'}</td><td class="small">${st}</td></tr>`;
  }).join('');
  return `<div class="card"><h2>💳 התאמה בין הבנק לכרטיס האשראי</h2>
    <p class="small muted">בדף הבנק מופיע חיוב אחד גדול לכרטיס בכל חודש, ובקובץ האשראי מופיע הפירוט של מה שקנית. התוכנה סופרת רק את הפירוט, כדי שלא ייספר פעמיים, ובודקת שהסכומים מתאימים.</p>
    <div class="tablewrap"><table><tr><th>חודש חיוב</th><th class="num">חיוב בבנק</th><th class="num">פירוט מהכרטיס</th><th>מצב</th></tr>${rows}</table></div></div>`;
}

// ---------- ביטוח רכב ----------
const CAR_INS_RE = /ביטוח רכב|ביטוח חובה|חובה רכב|מקיף|צד ג|ביטוח ישיר|ליברה|שומרה|9 מיליון|wesure|ווישור|aig|ביטוח לרכב/i;
function carInsurance(){
  const tx = db.tx.filter(t=>t.type==='expense' && (CAR_INS_RE.test(t.description) || (t.category==='ביטוחים' && /רכב/.test(t.description))));
  const months = monthsWithData();
  const span = Math.min(12, months.length);
  const recent = months.slice(-12);
  const paid = tx.filter(t=>recent.includes(ymOf(t.date))).reduce((a,t)=>a+t.amount,0);
  const manual = +db.settings.carInsAnnual || 0;
  let annual = manual, how = 'כתבת';
  if(!annual && tx.length){
    // אם משלמים בתשלומים חודשיים ויש פחות משנה של נתונים, מכפילים לשנה
    const monthsWith = new Set(tx.filter(t=>recent.includes(ymOf(t.date))).map(t=>ymOf(t.date))).size;
    annual = (monthsWith >= 2 && span < 12) ? paid/span*12 : paid;
    how = monthsWith >= 2 && span < 12 ? `לפי ${span} חודשים של תשלומים` : 'לפי החיובים בשנה האחרונה';
  }
  return {tx, annual, how, found: tx.length>0};
}
function carInsuranceCard(){
  const C = carInsurance(), M = MARKET.carIns;
  const hasCar = C.found || db.tx.some(t=>t.category==='רכב ודלק') || db.settings.carInsAnnual;

    if(C.annual > M.full[1]) verdict = `<div class="tip bad"><span>אתה משלם בערך <b>${money(C.annual)} בשנה</b> (${C.how}). זה <b>מעל הטווח המקובל</b> (${money(M.full[0])} עד ${money(M.full[1])} לחובה + מקיף). יש סיכוי טוב לחסוך כאן הרבה.</span></div>`;
    else if(C.annual > (M.full[0]+M.full[1])/2) verdict = `<div class="tip warn"><span>אתה משלם בערך <b>${money(C.annual)} בשנה</b> (${C.how}). זה בחלק העליון של הטווח המקובל (${money(M.full[0])} עד ${money(M.full[1])}). כדאי לבדוק הצעות נוספות.</span></div>`;
    else if(C.annual < M.mandatory[0]) verdict = `<div class="tip info"><span>מצאתי רק ${money(C.annual)} בשנה. ייתכן שחלק מהביטוח שולם בדרך אחרת. כתוב למטה כמה אתה משלם בשנה על הביטוח כולו.</span></div>`;
    else verdict = `<div class="tip good"><span>אתה משלם בערך <b>${money(C.annual)} בשנה</b> (${C.how}). זה בטווח הסביר. עדיין שווה להשוות לפני כל חידוש.</span></div>`;
  } else verdict = `<div class="tip info"><span>לא מצאתי בתנועות תשלום על ביטוח רכב. ייתכן ששילמת פעם בשנה, או מחשבון אחר. כתוב למטה כמה הוא עולה בשנה ואבדוק.</span></div>`;
  return `<div class="card"><h2>🚗 בדיקת ביטוח רכב</h2>

// ---------- תובנות ----------
function findRecurring(){
  const exp = db.tx.filter(t=>t.type==='expense' && !NOT_COUNTED.has(t.category));
  const groups = {};
  for(const t of exp){ const n = norm(t.description); if(!n) continue; (groups[n] = groups[n]||[]).push(t); }
  const recent = monthsWithData().slice(-3);
  const recurring = [];
  for(const [n, list] of Object.entries(groups)){
    const months = [...new Set(list.map(t=>ymOf(t.date)))];
    if(months.length < 2) continue;
    if(VARIABLE_CATS.has(list[list.length-1].category)) continue; // קניות שוטפות, לא חיוב קבוע
    const amounts = list.map(t=>t.amount);
    const avg = amounts.reduce((a,b)=>a+b,0)/amounts.length;
    const spread = Math.max(...amounts) - Math.min(...amounts);
    if(spread > Math.max(avg*0.25, 15)) continue; // סכומים משתנים מאוד = לא מנוי
    if(!recent.some(m=>months.includes(m))) continue;
    const sorted = [...list].sort((a,b)=>a.date.localeCompare(b.date));
    const last = sorted[sorted.length-1], first = sorted[0];
    recurring.push({name:last.description, cat:last.category, avg, months:months.length, last:last.amount, first:first.amount});
  }
  recurring.sort((a,b)=>b.avg-a.avg);
  return recurring;
}
function findInsights(){
  const out = [];
  const exp = db.tx.filter(t=>t.type==='expense' && !NOT_COUNTED.has(t.category));
  // 1. חיובים כפולים: אותו סכום ואותו תיאור בטווח של עד 3 ימים
  const seen = {};
  const dup = [];
  for(const t of [...exp].sort((a,b)=>a.date.localeCompare(b.date))){
    const k = norm(t.description)+'|'+t.amount.toFixed(2);
    const prev = seen[k];
    if(prev && (new Date(t.date)-new Date(prev.date))/86400000 <= 3) dup.push([prev,t]);
    seen[k] = t;
  }
  if(dup.length) out.push({kind:'bad', title:'ייתכן שחויבת פעמיים', html:
    'מצאתי חיובים זהים (אותו בית עסק ואותו סכום) בהפרש של עד 3 ימים. כדאי לבדוק מול הכרטיס או בית העסק:' +
    '<ul>' + dup.slice(0,15).map(([a,b])=>`<li>${esc(a.description)}: ${money(a.amount)} בתאריכים ${fmtDate(a.date)} ו-${fmtDate(b.date)}</li>`).join('') + '</ul>'});

  // 2. הוצאות קבועות / מנויים
  const allMonths = monthsWithData();
  const recurring = findRecurring();
  if(recurring.length){
    const yearly = recurring.reduce((s,r)=>s+r.avg*12,0);
    out.push({kind:'warn', title:`${recurring.length} הוצאות קבועות שחוזרות כל חודש (בערך ${money(yearly)} בשנה)`, html:
      'אלה חיובים שחוזרים בסכום דומה. עבור על הרשימה ושאל: אני עדיין משתמש בזה? יש מסלול זול יותר?' +
      '<div class="tablewrap"><table><tr><th>שם</th><th>קטגוריה</th><th class="num">בחודש</th><th class="num">בשנה</th></tr>' +
      recurring.map(r=>`<tr><td>${esc(r.name)}${r.last > r.first*1.08 ? ' <span class="pill">המחיר עלה</span>':''}</td><td class="small muted">${esc(r.cat)}</td><td class="num">${money(r.avg)}</td><td class="num">${money(r.avg*12)}</td></tr>`).join('') +
      '</table></div>'});
    // שירותים כפולים: כמה מנויים באותה קטגוריה
    const byCat = {};
    recurring.forEach(r=>{ (byCat[r.cat]=byCat[r.cat]||[]).push(r); });
    const dupServ = Object.entries(byCat).filter(([c,l])=>l.length>=2 && ['מנויים ושירותים דיגיטליים','תקשורת (טלפון / אינטרנט / טלוויזיה)','ביטוחים'].includes(c));
    dupServ.forEach(([c,l])=> out.push({kind:'warn', title:`כמה חיובים קבועים בקטגוריה "${c}"`, html:
      `יש ${l.length} חיובים קבועים: ${l.map(r=>esc(r.name)+' ('+money(r.avg)+')').join(', ')}. ` +
      (c==='ביטוחים' ? 'כדאי לבדוק שאין ביטוח כפול (למשל ביטוח בריאות פרטי שחופף לביטוח המשלים בקופת החולים). אפשר לבדוק את כל הביטוחים שלך באתר "הר הביטוח" של משרד האוצר.'
        : 'אולי יש שירות שחופף לאחר, או שאפשר לאחד לחבילה זולה יותר.')}));
  }

  // 3. קטגוריות שעלו החודש לעומת הממוצע
  if(allMonths.length >= 2){
    const cur = allMonths[allMonths.length-1];
    const prevs = allMonths.slice(-4,-1);
    const curS = monthStats(cur);
    const avgCat = {};
    prevs.forEach(m=>{ const s = monthStats(m); for(const [c,v] of Object.entries(s.byCat)) avgCat[c]=(avgCat[c]||0)+v/prevs.length; });
    const ups = Object.entries(curS.byCat).filter(([c,v]) => c!==MAASER_CAT && v - (avgCat[c]||0) > 200 && v > (avgCat[c]||0)*1.25)
      .sort((a,b)=>(b[1]-(avgCat[b[0]]||0))-(a[1]-(avgCat[a[0]]||0)));
    if(ups.length) out.push({kind:'warn', title:`הוצאות שעלו ב${monthName(cur)} לעומת החודשים הקודמים`, html:
      '<ul>' + ups.map(([c,v])=>`<li><b style="display:inline">${esc(c)}</b>: ${money(v)} לעומת ממוצע של ${money(avgCat[c]||0)}</li>`).join('') + '</ul>'});
  }

  // 4. עמלות בנק
  const fees = exp.filter(t=>t.category==='עמלות בנק וריביות');
  if(fees.length){
    const tot = fees.reduce((s,t)=>s+t.amount,0);
    out.push({kind:'warn', title:`שילמת ${money(tot)} עמלות וריביות לבנק`, html:
      'כדאי לבקש מהבנק "מסלול עמלות" או מעבר לפעולות דיגיטליות. אם יש ריבית חובה (מינוס), סגירת המינוס היא ההשקעה הכי משתלמת שיש, כי הריבית עליו גבוהה מכל תשואה בטוחה.'});
  }
  // 5. תנועות לא מסווגות
  const other = db.tx.filter(t=>t.category==='אחר');
  if(other.length) out.push({kind:'info', title:`${other.length} תנועות בלי קטגוריה`, html:
    'בלשונית "תנועות" אפשר לבחור לכל אחת קטגוריה. התוכנה תזכור את הבחירה ותסווג לבד את אותו בית עסק בפעם הבאה.'});
  // 6. חיובי כרטיס אשראי בדף הבנק
  const cc = db.tx.filter(t=>t.category==='חיוב כרטיס אשראי (לא נספר)');
  if(cc.length) out.push({kind:'info', title:'חיובי כרטיס אשראי לא נספרים פעמיים', html:
    `זיהיתי ${cc.length} שורות של "חיוב כרטיס אשראי" בדף הבנק. בחודשים שיש להם פירוט מקובץ האשראי, סופרים רק את הפירוט. בחודשים בלי פירוט, החיוב נספר כהוצאה כללית. ראה את טבלת ההתאמה למטה.`});

  // 7. רעיונות כלליים לפי מה שמופיע
  const avg = averages();
  if(avg && avg.surplus < 0) out.unshift({kind:'bad', title:'ההוצאות גבוהות מההכנסות', html:
    `בממוצע של החודשים האחרונים אתה מוציא ${money(-avg.surplus)} יותר ממה שנכנס. לפני כל השקעה, המטרה הראשונה היא לאזן: עבור על ההוצאות הקבועות למטה.`});
  return out;
}

      <p>כאן רואים כמה נכנס וכמה יצא בכל חודש, מוצאים הוצאות מיותרות, מנהלים את המעשרות ומקבלים כיוון לחיסכון ולהשקעה בטוחה.</p>
      <div class="row"><button class="btn primary" data-goto="import">ייבוא קובץ מהבנק</button><button class="btn" data-act="demo">הצג נתוני דוגמה</button><label class="btn">⬆ יש לי קובץ גיבוי: לשחזר<input type="file" id="restore" accept=".json" class="hidden"></label></div></div>
    <div class="grid">
      <div class="card"><h2>🔒 פרטיות מלאה</h2><p class="small">הכל נשמר רק במחשב הזה, בתוך הדפדפן. התוכנה חסומה לאינטרנט: היא לא יכולה לשלוח שום מידע החוצה, גם לא בטעות. אפשר אפילו לנתק את האינטרנט ולעבוד.</p></div>
      <div class="card"><h2>1. מורידים קובץ</h2><p class="small">מאתר הבנק או מחברת האשראי מורידים את פירוט התנועות כקובץ אקסל, ומעלים אותו בלשונית "ייבוא מהבנק ואשראי".</p></div>
      <div class="card"><h2>2. או מוסיפים ידנית</h2><p class="small">בלשונית "תנועות" אפשר להוסיף כל הכנסה או הוצאה. נתוני הדוגמה נמחקים בלחיצה אחת.</p></div>
    </div>`;
  const s = monthStats(curMonth);
  const maxCat = Math.max(1, ...Object.values(s.byCat));
  const cats = Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  const last6 = Array.from({length:6},(_,i)=>addMonths(curMonth, i-5));
  const st6 = last6.map(m=>monthStats(m));
  const max6 = Math.max(1, ...st6.flatMap(x=>[x.income,x.expense]));
  const top = s.tx.filter(t=>t.type==='expense' && !NOT_COUNTED.has(t.category)).sort((a,b)=>b.amount-a.amount).slice(0,5);
  const ins = findInsights().filter(i=>i.kind!=='info').length;
  const mLeft = s.maaserDue - s.maaserGiven;
  return monthBar() + `
  <div class="grid" style="margin-bottom:16px">
    <div class="stat"><span class="ico g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><div class="lbl">נכנס החודש</div><div class="val pos">${money(s.income)}</div></div>
    <div class="stat"><span class="ico r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span><div class="lbl">יצא החודש</div><div class="val neg">${money(s.expense)}</div>${s.savings?`<div class="sub">ועוד ${money(s.savings)} הופקדו לחיסכון</div>`:''}</div>
    <div class="stat"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg></span><div class="lbl">נשאר בסוף החודש</div><div class="val ${s.balance>=0?'pos':'neg'}">${money(s.balance)}</div></div>
    <div class="stat"><span class="ico p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span><div class="lbl">מעשרות החודש</div><div class="val">${money(s.maaserGiven)} <span class="small muted">מתוך ${money(s.maaserDue)}</span></div>
      <div class="sub">${mLeft>0?'נשאר לתת '+money(mLeft):'הושלם ✓'}</div></div>
  </div>
  ${todoCard()}
  ${marketAlertsCard(true)}
  <div class="grid two">${balanceCard()}${cushionCard(true)}</div>
  ${monthlySummary()}
  ${goalAlerts()}
  ${budgetAlerts()}
  ${ownerCard(s)}
  <div class="grid">
    <div class="card"><h2>לאן הלך הכסף</h2>
      ${cats.length? `<div class="bars">${cats.map(([c,v])=>`<div class="b"><div class="bl"><span>${esc(c)}</span><span>${money(v)} <span class="muted small">(${Math.round(v/s.expense*100)}%)</span></span></div><div class="bt"><div class="bf" style="width:${v/maxCat*100}%"></div></div></div>`).join('')}</div>` : '<div class="empty">אין הוצאות בחודש הזה</div>'}
    </div>
    <div>
      <div class="card"><h2>חצי שנה אחרונה</h2>
        <div class="mini">${st6.map((x,i)=>`<div class="col" title="${monthName(last6[i])}: נכנס ${money(x.income)}, יצא ${money(x.expense)}"><div class="pair"><div class="in" style="height:${x.income/max6*110}px"></div><div class="out" style="height:${x.expense/max6*110}px"></div></div><div class="ml">${shortMonth(last6[i])}</div></div>`).join('')}</div>
        <div class="legend"><span><i style="background:var(--green)"></i>נכנס</span><span><i style="background:var(--red)"></i>יצא</span></div>
      </div>
      <div class="card"><h2>ההוצאות הגדולות החודש</h2>
        ${top.length?`<table>${top.map(t=>`<tr><td>${esc(t.description)}<div class="small muted">${fmtDate(t.date)} · ${esc(t.category)}</div></td><td class="num">${money(t.amount)}</td></tr>`).join('')}</table>`:'<div class="empty">אין</div>'}
      </div>
    </div>
  </div>`;
}

let balEdit = false;
function balanceCard(){
  const B = db.balances, owners = db.settings.people.concat([JOINT]);
  const have = owners.filter(o=>B[o]);
  const total = have.reduce((s,o)=>s+(+B[o].amount||0),0);
  if(balEdit) return `<div class="card"><h2>🏦 כמה כסף יש בבנק</h2>

  const T = maaserTotals();
  if(T.left > 50) todo.push(['info', `נשאר לתת <b>${money(T.left)}</b> מעשרות.`, 'maaser', 'למעשרות']);

  if(other) todo.push(['info', `יש ${other} תנועות שהתוכנה לא יודעת מה הן. כדאי לבחור להן קטגוריה, והיא תזכור להבא.`, 'tx', 'לתנועות']);
  const P = db.profile;
  if(P.savings===undefined) todo.push(['info', 'כדי לקבל הצעה מה לעשות עם הכסף שנשאר, ענה על כמה שאלות קצרות בלשונית "השקעות".', 'invest', 'להשקעות']);
  else if(avg && avg.surplus > 0){
    const target = Math.round(avg.expense*4/1000)*1000;
    if((+P.savings||0) < target) todo.push(['good', `כדאי להעביר כל חודש בערך <b>${money(avg.surplus)}</b> ל<b>קרן כספית</b> (חיסכון בטוח שאפשר למשוך תוך יום), עד שיהיו שם בערך ${money(target)} למקרה חירום.`, 'invest', 'למה ואיך']);
    else todo.push(['good', `יש לך כרית ביטחון. את ה-${money(avg.surplus)} שנשארים כל חודש אפשר להתחיל להשקיע לטווח ארוך, בהשקעה זולה ופשוטה.`, 'invest', 'להצעה המלאה']);
  }

let txFilter = {type:'all', q:'', owner:'all'};

function catOptions(type, sel){ return (type==='income'?INC_CATS:EXP_CATS).map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join(''); }
// עו"ש ממוזג: כל תנועות הבנק של כל החשבונות, עם היתרה המשותפת אחרי כל תנועה.
// היתרה מחושבת אחורה וקדימה מהיתרה הידועה של כל חשבון (מקובץ הבנק או ידנית).
const ledgerOrder = (a,b) => a.date.localeCompare(b.date) || (a.imp===b.imp && a.ord!=null && b.ord!=null ? a.ord-b.ord : a.id-b.id);
function bankLedger(owners){
  const bankTx = db.tx.filter(t=>!t.card && !t.splitOf);
  const sign = t => (t.type==='income'?1:-1) * (+(t.origAmount ?? t.amount));
  const after = new Map(), known = [], unknown = [];
  owners.forEach(o=>{
    const list = bankTx.filter(t=>(t.owner||JOINT)===o).sort(ledgerOrder);
    const B = db.balances[o];
    if(!list.length) return;
    const hasBal = list.some(t=>t.bal!=null);
    if(!B && !hasBal){ unknown.push(o); return; }
    known.push(o);
    // נקודת עיגון: יתרה מהקובץ אם יש, אחרת היתרה הידועה של החשבון
    let k = -1, anchor;
    list.forEach((t,i)=>{ if(t.bal!=null) k = i; });
    if(k>=0) anchor = list[k].bal;
    else { list.forEach((t,i)=>{ if(t.date <= B.date) k = i; }); anchor = +B.amount; }
    const val = new Array(list.length);
    if(k>=0){ val[k] = anchor; for(let i=k-1;i>=0;i--) val[i] = list[i].bal ?? (val[i+1] - sign(list[i+1])); }
    for(let i=k+1;i<list.length;i++) val[i] = list[i].bal ?? ((i===0 ? anchor : val[i-1]) + sign(list[i]));
    list.forEach((t,i)=>after.set(t.id, {o, v: val[i]}));
  });
  // מיזוג: אחרי כל תנועה, סוכמים את היתרה האחרונה של כל חשבון
  const all = bankTx.filter(t=>owners.includes(t.owner||JOINT)).sort(ledgerOrder);
  const cur = {};
  known.forEach(o=>{ const first = all.find(t=>(t.owner||JOINT)===o); const a = after.get(first.id); cur[o] = a.v - sign(first); });
  const rows = all.map(t=>{ const a = after.get(t.id); if(a) cur[a.o] = a.v; return {t, amt: sign(t), total: known.length ? known.reduce((s,o)=>s+cur[o],0) : null}; });
  return {rows, known, unknown};
}

// אילו חודשים כבר הוכנסו: עו"ש ואשראי, לכל חשבון
function coverageCard(){
  const real = db.tx.filter(t=>!t.demo && !t.splitOf);
  if(!real.length) return '';
  const all = real.map(t=>ymOf(t.date)).concat(real.filter(t=>t.card).map(cardBillMonth)).sort();
  let months = []; for(let m = all[0]; m <= all[all.length-1]; m = addMonths(m,1)) months.push(m);
  months = months.slice(-18);
  const owners = ownerList().filter(o=>real.some(t=>(t.owner||JOINT)===o));
  const gaps = [];
  const rows = owners.map(o=>{
    const mine = real.filter(t=>(t.owner||JOINT)===o);
    const bank = {}, card = {}, ccCharge = {};
    mine.forEach(t=>{ if(t.card){ const m = cardBillMonth(t); card[m]=(card[m]||0)+1; } else { const m = ymOf(t.date); bank[m]=(bank[m]||0)+1; if(t.category===CC_CAT) ccCharge[m]=true; } });
    const bk = Object.keys(bank).sort(), first = bk[0], last = bk[bk.length-1];
    const anyCard = Object.keys(card).length > 0;
    const bankRow = months.map(m=>{
      if(bank[m]) return `<td class="cv ok" title="${bank[m]} תנועות">✓</td>`;
      if(first && m>first && m<last){ gaps.push([`עו"ש של ${o}`, m]); return '<td class="cv miss" title="חסר">חסר</td>'; }
      return '<td class="cv"></td>'; });
    const cardRow = months.map(m=>{
      if(card[m]) return `<td class="cv ok" title="${card[m]} עסקאות">✓</td>`;
      if(ccCharge[m]){ gaps.push([`פירוט אשראי של ${o}`, m]); return '<td class="cv warn" title="בעו״ש יש חיוב אשראי בחודש הזה, אבל אין פירוט">חסר</td>'; }
      return '<td class="cv"></td>'; });
    return `<tr><th rowspan="2" style="white-space:nowrap">${esc(o)}</th><td class="small">עו"ש</td>${bankRow.join('')}</tr>
      <tr><td class="small" style="white-space:nowrap">אשראי${anyCard?'':' <span class="muted">(לא יובא)</span>'}</td>${cardRow.join('')}</tr>`;
  }).join('');
  return `<div class="card"><h2>📆 אילו חודשים כבר הוכנסו</h2>
    <p class="small muted">✓ = יש נתונים. "חסר" באדום = חודש באמצע שאין לו עו"ש. "חסר" בצהוב = בעו"ש יש חיוב אשראי, אבל עוד לא יובא פירוט האשראי של החודש הזה (האשראי מסודר לפי חודש החיוב).</p>
    <div class="tablewrap"><table class="cover"><tr><th></th><th></th>${months.map(m=>`<th class="cv">${shortMonth(m)}</th>`).join('')}</tr>${rows}</table></div>
    ${gaps.length?`<div class="tip warn"><b>מה חסר</b>${Object.entries(gaps.reduce((g,[k,m])=>((g[k]=g[k]||[]).push(shortMonth(m)),g),{})).map(([k,ms])=>`<div>${esc(k)}: ${ms.join(', ')}</div>`).join('')}</div>`:'<div class="tip good"><b>אין חורים 👍</b>כל החודשים מכוסים.</div>'}
  </div>`;
}

function findHeaderRow(rows){
  // שורת הכותרות: יש בה "תאריך", לפחות 3 תאים קצרים, ואחריה שורות עם תאריך אמיתי
  let best = -1, bestScore = 0;
  for(let i=0;i<Math.min(rows.length,60);i++){
    const r = rows[i].map(c=>String(c).trim());
    const filled = r.filter(c=>c);
    if(filled.length < 3 || !r.some(c=>/תאריך|date/i.test(c)) || filled.some(c=>c.length>40)) continue;
    const dated = rows.slice(i+1, i+6).filter(x=>x.some(c=>parseDate(c))).length;
    const score = filled.length + dated*3;
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return best>=0 ? best : 0;
}
function pickCol(header, patterns){
  for(const p of patterns){ const i = header.findIndex(h=>p.test(String(h))); if(i>=0) return i; }
  return -1;
}

function buildImported(){
  const g = id => +$('#'+id).value;
  const mode = $('#iMode').value;
  $('#wAmt').classList.toggle('hidden', mode==='split');
  $('#wDeb').classList.toggle('hidden', mode!=='split');
  $('#wCred').classList.toggle('hidden', mode!=='split');
  $('#wBill').classList.toggle('hidden', mode!=='allexp');
  $('#wBal').classList.toggle('hidden', mode==='allexp');
  let cD=g('iDate'), cS=g('iDesc'), cA=g('iAmt'), cDe=g('iDeb'), cC=g('iCred'), cB=g('iBill'), cK=g('iCat'), cN=g('iNote');
  const isCard = mode==='allexp';
  // אם יש בקובץ עוד שורת כותרות (גיליון נוסף), מתאימים את העמודות לפי השמות
  const names = [cD,cS,cA,cDe,cC,cB,cK,cN].map(i=>i>=0 ? imp.header[i] : null);
  const out = [];
  const cBal = ($('#iBal') && mode!=='allexp') ? +$('#iBal').value : -1;
  let rowNo = 0;
  for(const r of imp.rows.slice(imp.hr+1)){
    rowNo++;
    const rs = r.map(c=>String(c).replace(/\s+/g,' ').trim());
    if(names[0] && rs.includes(names[0]) && !parseDate(r[cD])){
      const idx = n => n ? rs.indexOf(n) : -1;
      [cD,cS,cA,cDe,cC,cB,cK,cN] = names.map(idx); if(cD<0) break; continue;
    }
    const date = parseDate(r[cD]); if(!date) continue;
    let type, amount;
    if(mode==='split'){
      const d = parseAmount(r[cDe]), c = parseAmount(r[cC]);
      if(Math.abs(d)>0){ type='expense'; amount=Math.abs(d); } else if(Math.abs(c)>0){ type='income'; amount=Math.abs(c); } else continue;
    } else {
      const a = parseAmount(r[cA]); if(!a) continue;
      if(mode==='allexp'){ type = a>0 ? 'expense' : 'income'; amount = Math.abs(a); }
      else { type = a<0 ? 'expense' : 'income'; amount = Math.abs(a); }
    }
    const description = String(cS>=0 ? r[cS] : '').trim() || 'ללא תיאור';
    const t = {date, type, amount, description};
    if(cK>=0 && String(r[cK]||'').trim()) t.srcCat = String(r[cK]).trim();
    if(cN>=0 && String(r[cN]??'').trim()) t.note = String(r[cN]).replace(/\s+/g,' ').trim();
    // אין תיאור אבל יש פירוט: הפירוט הוא התיאור
    if(t.description==='ללא תיאור' && t.note){ t.description = t.note; delete t.note; }
    if(isCard){ t.card = true; const bd = cB>=0 ? parseDate(r[cB]) : null; if(bd) t.billDate = bd; }
    t.row = rowNo;
    if(cBal>=0 && /\d/.test(String(r[cBal]??''))) t.bal = parseAmount(r[cBal]);
    out.push(t);
  }
  return out;
}
// היתרה העדכנית מהקובץ: השורה עם התאריך המאוחר ביותר (הבנק יכול למיין מהחדש לישן או להפך)
function latestBalance(){
  const cB = +$('#iBal').value, cD = +$('#iDate').value;
  if(cB<0 || cD<0 || $('#iMode').value==='allexp') return null;
  const rows = imp.rows.slice(imp.hr+1).map(r=>({d:parseDate(r[cD]), raw:String(r[cB]??'').trim()})).filter(x=>x.d && x.raw && /\d/.test(x.raw));
  if(!rows.length) return null;
  const desc = rows[0].d >= rows[rows.length-1].d;
  const max = rows.reduce((m,x)=>x.d>m?x.d:m, rows[0].d);
  const same = rows.filter(x=>x.d===max);
  const pick = desc ? same[0] : same[same.length-1];
  return {amount: parseAmount(pick.raw), date: pick.d};
}
// לפי הסכום המקורי, כדי שתנועה שפוצלה לא תיובא שוב בייבוא הבא
const txKey = t => t.date+'|'+t.type+'|'+(+(t.origAmount ?? t.amount)).toFixed(2)+'|'+norm(t.description);
function previewImport(){
  if($('#iDate').value==='-1'){ $('#impPrev').innerHTML = '<div class="tip warn">בחר עמודת תאריך</div>'; return; }
  if(!$('#iOwner').value){ $('#impPrev').innerHTML = '<div class="tip warn">בחר למעלה של מי הקובץ: הכפתור עם השם.</div>'; return; }
  const list = buildImported();
  // זיהוי כפילויות: תנועה שכבר קיימת (אותו תאריך, סכום, תיאור ובעל חשבון) לא תיובא שוב.
  // סופרים כמה פעמים כל תנועה קיימת, כדי ששתי קניות זהות אמיתיות באותו יום לא ייבלעו.
  const owner = $('#iOwner').value;
  const k = t => txKey(t) + '|' + (t.owner||JOINT);
  const pool = {};
  db.tx.forEach(t=>{ if(t.splitOf) return; (pool[k(t)] = pool[k(t)]||[]).push(t); });
  const used = new Set(), enrich = [];
  // פירוט חדש מהקובץ לתנועה שכבר קיימת. לא דורסים פירוט שכתבת בעצמך.
  const addEnrich = (x, f) => {
    const note = f.note || (norm(f.description)!==norm(x.description) ? f.description : '');
    if(note && note!==x.note && (!x.note || x.noteSrc==='file')) enrich.push({x, note});
  };
  let fresh = list.filter(t=>{ const arr = pool[k({...t, owner})]; const x = arr && arr.find(y=>!used.has(y)); if(x){ used.add(x); addEnrich(x, t); return false; } return true; });
  // שלב 2: אותה תנועה, אבל הקובץ החדש שונה (פירוט העברות, תיאור מפורט, תאריך ביצוע שונה בכמה ימים, או חשבון אחר שנבחר בטעות)
  const nd = s => norm(s).replace(/\s/g,'');
  const dd = (a,b) => Math.abs(daysBetween(a,b));
  fresh = fresh.filter(t=>{
    let best = null, bs = -1;
    for(const y of db.tx){
      if(used.has(y) || y.splitOf || y.category===CC_CAT) continue;
      if(Math.abs((+(y.origAmount ?? y.amount)) - t.amount) >= 0.005) continue;
      const gap = dd(y.date, t.date); if(gap > 3) continue;
      if(y.bal!=null && t.bal!=null && !!y.card===!!t.card){ if(Math.abs(y.bal - t.bal) >= 0.01) continue; }

function parseAmount(v){
  if(typeof v==='number') return v;
  let s = String(v??'').trim(); if(!s) return 0;
  const neg = /^\(.*\)$/.test(s) || /[-−]/.test(s);
  s = s.replace(/[^\d.,]/g,'');
  if(/,\d{1,2}$/.test(s) && !/\./.test(s)) s = s.replace(',', '.');
  s = s.replace(/,/g,'');
  const n = parseFloat(s); if(isNaN(n)) return 0;
  return neg ? -n : n;
}
function parseDate(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())){
    const n = +v; if(n>20000 && n<80000){ const d = new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); return d.toISOString().slice(0,10); }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if(m){ let y = m[3]; if(y.length===2) y = '20'+y; const mo=+m[2], d=+m[1]; if(mo<1||mo>12||d<1||d>31) return null; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  return null;
}
async function readAnyFile(f){
  const buf = await f.arrayBuffer();

  if(u8[0]===0x50 && u8[1]===0x4b) return readXlsx(buf);
  if(u8[0]===0xD0 && u8[1]===0xCF) throw new Error('זה קובץ אקסל בפורמט ישן (xls). פתח אותו באקסל, בחר "שמירה בשם" ושמור כ-xlsx או CSV, ואז נסה שוב.');
  let text;
  try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('windows-1255').decode(buf); }
  text = text.replace(/^﻿/,'');
  if(/^\s*</.test(text)) return readHtmlTable(text);
  return parseCsv(text);
}
function parseCsv(text){
  const first = text.split(/\r?\n/).slice(0,10).join('\n');
  const cnt = ch => (first.match(new RegExp(ch==='|'?'\\|':ch,'g'))||[]).length;
  const delim = [',',';','\t','|'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q = true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
function readHtmlTable(text){
  const doc = new DOMParser().parseFromString(text,'text/html');

  doc.querySelectorAll('tr').forEach(tr=>{
    if(tr.querySelector('tr')) return;
    const r = [...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).map(td=>td.textContent.replace(/\s+/g,' ').trim());
    if(r.some(x=>x)) rows.push(r);
  });

}
async function readXlsx(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }

  const files = {};
  for(let n=0;n<count;n++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))] = {method,csize,off};
    p += 46+nl+el+cl;
  }
  async function get(name){
    const f = files[name]; if(!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off+26,true) + dv.getUint16(f.off+28,true);
    const data = u8.subarray(start, start+f.csize);
    if(f.method===0) return td.decode(data);
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return td.decode(await new Response(stream).arrayBuffer());
  }
  const xp = new DOMParser();
  const ssXml = await get('xl/sharedStrings.xml');

  // כל הגיליונות לפי הסדר (למשל במקס: עסקאות בארץ, ועסקאות בחו"ל בגיליון נפרד)
  let sheetNames = [];
  try{
    const wb = xp.parseFromString(await get('xl/workbook.xml'),'application/xml');
    const rels = xp.parseFromString(await get('xl/_rels/workbook.xml.rels'),'application/xml');
    for(const s1 of wb.getElementsByTagName('sheet')){
      const rid = s1.getAttribute('r:id') || s1.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      const rel = [...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
      if(rel){ let t = rel.getAttribute('Target').replace(/^\//,''); if(!t.startsWith('xl/')) t = 'xl/'+t; if(files[t]) sheetNames.push(t); }
    }
  }catch(e){}
  if(!sheetNames.length) sheetNames = Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort();
  const rows = [];
  for(const sheetName of sheetNames){
  const sh = xp.parseFromString(await get(sheetName),'application/xml');
  for(const r of sh.getElementsByTagName('row')){
    const row = [];
    for(const c of r.getElementsByTagName('c')){
      const ref = c.getAttribute('r') || '';
      const letters = ref.replace(/\d/g,'');
      let col = 0; for(const ch of letters) col = col*26 + (ch.charCodeAt(0)-64); col = col ? col-1 : row.length;
      const t = c.getAttribute('t'); const v = c.getElementsByTagName('v')[0];
      let val = '';
      if(t==='s') val = shared[+v?.textContent] ?? '';
      else if(t==='inlineStr') val = [...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(t==='str' || t==='b' || t==='e') val = v ? v.textContent : '';
      else val = v ? +v.textContent : '';
      row[col] = val;
    }
    for(let i=0;i<row.length;i++) if(row[i]===undefined) row[i]='';
    if(row.some(x=>String(x).trim())) rows.push(row);
  }
  }
  return rows;
}

  if(s.balance >= 0) good.push(`נשארו ${money(s.balance)} בסוף החודש.`); else improve.push(`החודש נגמר במינוס של ${money(-s.balance)}.`);
  if(before.length){
    const avgCat = {}; before.forEach(x=>{ for(const [c,v] of Object.entries(x.byCat)) avgCat[c]=(avgCat[c]||0)+v/before.length; });
    const diffs = Object.keys({...avgCat, ...s.byCat}).filter(c=>c!==MAASER_CAT).map(c=>[c,(s.byCat[c]||0)-(avgCat[c]||0)]);
    diffs.filter(([c,d])=>d < -150).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(([c,d])=>good.push(`הוצאת ${money(-d)} פחות מהרגיל על ${esc(c)}.`));
    diffs.filter(([c,d])=>d > 150).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([c,d])=>improve.push(`הוצאת ${money(d)} יותר מהרגיל על ${esc(c)}.`));
  }
  for(const [c,b] of Object.entries(db.budgets)){ const sp = s.byCat[c]||0; if(+b>0){ if(sp>b) improve.push(`חריגה מהתקציב ב${esc(c)} (${money(sp)} מתוך ${money(b)}).`); else if(sp>0) good.push(`עמדת בתקציב של ${esc(c)}.`); } }
  if(s.maaserDue>0){ if(s.maaserGiven >= s.maaserDue) good.push('נתת את כל המעשרות של החודש.'); else improve.push(`נשארו ${money(s.maaserDue-s.maaserGiven)} מעשרות מהחודש.`); }
  return `<div class="card" style="border-color:var(--primary)"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📋 סיכום ${monthName(prev)}</h2><button class="btn sm" data-act="summaryseen">סגור</button></div>
    <p>נכנסו <b class="pos">${money(s.income)}</b>, יצאו <b class="neg">${money(s.expense)}</b>${s.savings?`, והפקדת ${money(s.savings)} לחיסכון`:''}.</p>
    <div class="grid">
      <div class="tip good"><b>👍 מה הלך טוב</b>${good.length?'<ul style="margin:4px 0">'+good.slice(0,4).map(x=>`<li>${x}</li>`).join('')+'</ul>':'<span>החודש היה דומה לרגיל.</span>'}</div>
      <div class="tip warn"><b>💡 מה כדאי לשפר</b>${improve.length?'<ul style="margin:4px 0">'+improve.slice(0,4).map(x=>`<li>${x}</li>`).join('')+'</ul>':'<span>לא מצאתי משהו מיוחד. כל הכבוד!</span>'}</div>
    </div></div>`;
}

// ---------- מטרות חיסכון ----------
const monthsBetween = (a, b) => { const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); };
function goalSaved(g){ return (g.deposits||[]).reduce((a,d)=>a+d.amount,0); }
// מטרות לפי סדר עדיפות: קודם מה שהתאריך שלו קרוב (מטרה בלי תאריך בסוף)
const goalOrder = (a,b) => (a.date||'9999').localeCompare(b.date||'9999') || a.id-b.id;
function committedBefore(id){
  const open = db.goals.filter(g=>goalSaved(g) < g.amount).sort(goalOrder);
  const i = open.findIndex(g=>g.id===id); if(i<0) return committedPerMonth(id);
  return open.slice(0,i).reduce((a,g)=>a+(+g.monthly||0),0);
}
function committedPerMonth(exceptId){ // כמה כבר "תפוס" כל חודש ע"י מטרות אחרות
  return db.goals.filter(g=>g.id!==exceptId && goalSaved(g) < g.amount).reduce((a,g)=>a+(+g.monthly||0),0);
}
// מתכנן: כמה צריך לשים בחודש, מתי אפשר, ומאיפה להביא את הכסף
function planGoal(name, amount, date, saved, exceptId){
  const avg = averages();
  const surplus = avg ? avg.surplus : 0;
  const free = surplus - (exceptId!=null ? committedBefore(exceptId) : committedPerMonth());
  const left = Math.max(0, amount - (saved||0));
  const r = {left, free, surplus, lines:[], status:'ok'};
  if(left===0){ r.lines.push(['good','כבר יש לך את כל הסכום! 🎉']); r.monthly = 0; r.status = 'done'; return r; }
  const nowYm = todayStr().slice(0,7);
  if(date){
    const months = Math.max(1, monthsBetween(nowYm, date.slice(0,7)));
    r.monthly = Math.ceil(left/months/10)*10;
    r.lines.push(['info', `כדי להגיע ל-${money(amount)} עד ${monthName(date.slice(0,7))} צריך לשים בצד בערך <b>${money(r.monthly)} בחודש</b> (${months} חודשים).`]);
  }
  if(!avg){ r.lines.push(['warn','עוד אין מספיק נתוני הכנסות והוצאות כדי לבדוק אם זה אפשרי. ייבא קובץ מהבנק.']); r.monthly = r.monthly||0; r.status = 'nodata'; return r; }
  if(free <= 0){
    r.status = 'none';
    r.lines.push(['bad', free===surplus ? `כרגע לא נשאר כסף בסוף החודש (בממוצע ${money(surplus)}). כדי לחסוך למטרה הזו צריך קודם לפנות כסף מההוצאות.` : `כל מה שנשאר בסוף החודש כבר הולך למטרות אחרות. אפשר לדחות מטרה אחרת או לפנות כסף מההוצאות.`]);
  } else if(!date){
    const m = Math.ceil(left / free);
    const when = addMonths(nowYm, m);
    r.monthly = Math.ceil(free/2/10)*10; // בלי תאריך: מתכננים לפי חצי מהעודף, כדי להשאיר מקום לדברים אחרים
    r.lines.push(['good', `אם תשים בצד את כל מה שנשאר לך בחודש (${money(free)}), תגיע למטרה בעוד <b>${m} חודשים</b>, בערך ב<b>${monthName(when)}</b>.`]);
    const half = Math.ceil(left / (free/2));
    r.lines.push(['info', `ההמלצה שלי: לשים בצד חצי מהעודף, <b>${money(r.monthly)} בחודש</b>, ולהשאיר את השאר לקרן חירום ולהפתעות. ככה תגיע למטרה בעוד ${half} חודשים, ב${monthName(addMonths(nowYm, half))}.`]);
  } else if(r.monthly <= free){
    r.lines.push(['good', `זה אפשרי ✓ נשארים לך בממוצע ${money(free)} בחודש${free!==surplus?' (אחרי מטרות אחרות)':''}, כך שאחרי החיסכון למטרה עוד יישארו ${money(free - r.monthly)}.`]);
  } else {
    const gap = r.monthly - free;
    const m = Math.ceil(left / free);
    r.status = 'short'; r.gap = gap; r.lateWhen = addMonths(nowYm, m);
    r.lines.push(['warn', `חסרים בערך <b>${money(gap)} בחודש</b> כדי להגיע בזמן. בקצב של מה שנשאר לך (${money(free)} בחודש) תגיע לזה ב${monthName(addMonths(nowYm, m))}.`]);
  }
  // מאיפה אפשר להביא את הכסף: הוצאות גמישות שאפשר לצמצם
  const D = dataProfile();
  if(D && (free <= 0 || (date && r.monthly > free))){
    const flex = ['אוכל בחוץ ומשלוחים','פנאי וחופשות','ביגוד והנעלה','בית וריהוט','מנויים ושירותים דיגיטליים','תקשורת (טלפון / אינטרנט / טלוויזיה)'];
    const opts = flex.filter(c=>D.catAvg[c]>50).map(c=>[c, D.catAvg[c]]).sort((a,b)=>b[1]-a[1]).slice(0,3);
    r.flex = opts;
    if(opts.length) r.lines.push(['info', 'הכי קל לפנות כסף מההוצאות הגמישות שלך: ' + opts.map(([c,v])=>`<b>${esc(c)}</b> (${money(v)} בחודש, הורדה של רבע = ${money(v/4)})`).join(', ') + '.']);
  }
  // איפה לשמור את הכסף בינתיים: "מגירה" לפי מתי צריך אותו
  const horizonM = date ? monthsBetween(nowYm, date.slice(0,7)) : (free>0 ? Math.ceil(left/(r.monthly||free)) : 12);
  const dr = goalDrawer(horizonM); r.drawer = dr;
  r.lines.push(['info', `<b>${dr.icon} המגירה של המטרה הזו: ${dr.name}.</b> ${dr.why}`]);
  // מתי לקנות
  const tip = buyTiming(name);
  if(tip) r.lines.push(['info', `<b>מתי לקנות:</b> ${tip}`]);
  r.tip = tip;
  return r;
}
function buyTiming(name){
  const n = String(name||'');
  if(/מזגן/.test(n)) return 'מזגנים זולים יותר בחורף (נובמבר עד פברואר), לפני שהביקוש עולה.';
  if(/מקרר|מכונת כביסה|מייבש|מדיח|תנור|טלוויזיה|מחשב|טלפון|סלולר|אייפון|מוצרי חשמל/.test(n)) return 'מוצרי חשמל ואלקטרוניקה זולים יותר במבצעי סוף נובמבר (בלאק פריידי) ולפעמים לפני החגים. שווה להשוות מחירים באתר השוואה ולחכות למבצע.';
  if(/רכב|אוטו|מכונית/.test(n)) return 'בסוף השנה (נובמבר-דצמבר) סוכנויות מנסות לסגור מכסות ונותנות הנחות על דגמי השנה הקודמת. שווה גם לבדוק רכב יד שנייה מליסינג.';
  if(/חופשה|טיסה|נופש|חו"ל|מלון|צימר/.test(n)) return 'מחוץ לעונה (לא בחגים ולא ביולי-אוגוסט) המחירים נמוכים בהרבה. טיסות כדאי להזמין 2 עד 4 חודשים מראש.';
  if(/ריהוט|ספה|מיטה|ארון|רהיט/.test(n)) return 'ברשתות הריהוט יש מבצעים גדולים לפני פסח ולפני ראש השנה. שווה לחכות לזה.';
  if(/חתונה|בר מצוה|בר-מצוה|בת מצוה|שמחה/.test(n)) return 'כדאי לסגור ספקים מוקדם. מחירי אולמות נמוכים יותר באמצע השבוע ובחורף.';
  if(/דירה|הון עצמי/.test(n)) return 'זו מטרה ארוכה. כדאי לבדוק זכאות ל"דירה בהנחה" או למסלולי משכנתא מוזלים לפני הקנייה, ולדבר עם יועץ משכנתאות.';
  return '';
}
function goalAlerts(){
  const out = [];
  for(const g of db.goals){
    const sv = goalSaved(g), pct = g.amount ? sv/g.amount : 0;
    if(pct >= 1 && !g.celebrated) out.push(`<div class="tip good" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b style="display:inline">🎉 כל הכבוד! הגעת למטרה "${esc(g.name)}"</b>: חסכת ${money(sv)}.</span><button class="btn sm" data-goalack="${g.id}">תודה!</button></div>`);
    else if(pct >= 0.5 && pct < 1 && !g.half) out.push(`<div class="tip good" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b style="display:inline">👏 עברת חצי דרך במטרה "${esc(g.name)}"</b>: ${money(sv)} מתוך ${money(g.amount)}.</span><button class="btn sm" data-goalhalf="${g.id}">יופי</button></div>`);
  }
  return out.join('');
}
// מה לעשות בפועל עם המטרה: 1 עד 3 שורות
function goalActions(g, plan){
  const L = [];
  const mon = +g.monthly || plan.monthly || 0;
  const dr = plan.drawer;
  if(plan.status==='none'){
    L.push(['bad', `<b>אין כרגע כסף פנוי למטרה הזו.</b> ${plan.flex&&plan.flex.length?`קודם לצמצם ב${plan.flex.slice(0,2).map(([c,v])=>`<b>${esc(c)}</b> (${money(v)} בחודש)`).join(' וב')}.`:'קודם צריך לצמצם הוצאות.'}`, null, 'insights']);
  } else if(mon){
    L.push([plan.status==='short'?'warn':'good', `<b>לשים בצד ${money(mon)} בכל חודש${dr?` ב${esc(dr.name)}`:''}.</b> אחרי כל הפקדה לוחצים כאן "הוספתי לחיסכון".`, dr ? howForPlace(dr.name) : null]);
  }
  if(plan.status==='short'){
    const cut = `לצמצם הוצאות ב-${money(plan.gap)} בחודש${plan.flex && plan.flex.length ? ` (הכי קל ב${plan.flex.slice(0,2).map(([c])=>`<b>${esc(c)}</b>`).join(' וב')})` : ''}`;
    L.push(['bad', `<b>חסרים ${money(plan.gap)} בחודש כדי להגיע בזמן.</b> לבחור אחד: ${cut}, או לדחות את היעד ל<b>${monthName(plan.lateWhen)}</b>.`]);
  }
  if(plan.tip) L.push(['info', `💡 <b>מתי לקנות:</b> ${plan.tip}`]);
  return `<ol class="bl-list">${L.map(([k,t,how,go])=>`<li class="${k}"><span>${t}${how?`<details class="how"><summary>איך עושים את זה בפועל?</summary>${how}</details>`:''}</span>${go?`<button class="btn sm" data-goto="${go}">איפה לחסוך ←</button>`:''}</li>`).join('')}</ol>
    <details class="how" style="margin-top:8px"><summary>למה? פירוט החישוב</summary>${plan.lines.map(([k,t])=>`<div style="margin:6px 0">${t}</div>`).join('')}</details>`;
}
// סיכום כל המטרות יחד: האם הכסף מספיק לכולן

  const open = db.goals.filter(g=>goalSaved(g) < g.amount); if(!open.length) return '';

      <div class="stat"><div class="lbl">נשאר לכם בממוצע</div><div class="val ${have>0?'pos':'neg'}">${money(avg.surplus)}</div><div class="sub">בסוף כל חודש</div></div>

// ---------- מעשרות ----------
function maaserByOwner(){
  const by = {};
  for(const t of db.tx){
    if(NOT_COUNTED.has(t.category)) continue;
    const o = t.owner||JOINT; by[o] = by[o] || {due:0, given:0};
    if(t.type==='income') by[o].due += txDue(t);
    else if(t.category===MAASER_CAT) by[o].given += t.amount;
  }
  db.maaserManual.forEach(x=>{ const o = x.owner||JOINT; by[o] = by[o] || {due:0, given:0}; if(x.kind==='given') by[o].given += +x.amount; else by[o].due += +x.amount; });
  const owners = ownerList().filter(o=>by[o]);
  if(owners.length < 2) return '';
  return `<div class="card"><h2>מעשרות לפי חשבון</h2>
    <p class="small muted">הסיכום למעלה הוא של שני החשבונות יחד. לא משנה מאיזה חשבון נתתם, הכל נספר לחובה המשותפת.</p>
    <table><tr><th>חשבון</th><th class="num">צריך לתת מההכנסות שלו</th><th class="num">ניתן ממנו</th></tr>
    ${owners.map(o=>`<tr><td>${esc(o)}</td><td class="num">${money(by[o].due)}</td><td class="num">${money(by[o].given)}</td></tr>`).join('')}</table></div>`;
}
function viewMaaser(){
  const T = maaserTotals();
  const s = monthStats(curMonth);
  const pct = db.settings.maaserPct;
