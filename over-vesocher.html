// ---------- השקעות ----------
const HOW_TO = {
  kaspit: 'באפליקציה או באתר של הבנק נכנסים ל"ניירות ערך" / "שוק ההון", מחפשים "קרן כספית" ובוחרים אחת עם דמי ניהול נמוכים (עד 0.25%). קונים בסכום הזה. כשצריך את הכסף, מוכרים ומקבלים אותו לחשבון תוך יום.',
  order: 'בבנק מבקשים "הוראת קבע לקניית קרן כספית" (או "תוכנית חיסכון חודשית"). אם אין אפשרות כזו, קונים כל חודש ידנית באותו יום.',
  gemel: 'באתר של אחד מבתי ההשקעות הגדולים פותחים אונליין "קופת גמל להשקעה" (לוקח כ-10 דקות), בוחרים את המסלול, ומגדירים הוראת קבע מהבנק. משווים דמי ניהול: עד 0.7% מהצבירה זה סביר.',
  deposit: 'באפליקציה של הבנק נכנסים ל"פיקדונות", בוחרים פיקדון שקלי לשנה בריבית קבועה, ומשווים לריבית בבנק אחר. אפשר גם להתמקח.',
  debt: 'מעבירים את הכסף הפנוי לסגירת המינוס. על הלוואה שואלים בבנק כמה עולה פירעון מוקדם.',
};
const howForPlace = place => /גמל|מחקה/.test(place) ? HOW_TO.gemel : /פיקדון/.test(place) ? HOW_TO.deposit : HOW_TO.kaspit;
// לאן לשים כסף לטווח ארוך, לפי התשובות שלך
function longTermPlace(P){
  if(P.horizon==='long' && P.risk==='bal') return 'קופת גמל להשקעה, מסלול מחקה מדד';
  if(P.horizon==='long' && P.risk==='mid') return 'קופת גמל להשקעה, מסלול כללי';
  if(P.horizon==='mid') return 'פיקדון לשנה או קרן כספית';
  return 'קרן כספית';
}
// השורה התחתונה: מה לעשות עכשיו, בכמה שורות
function bottomLine(){
  const P = db.profile, avg = averages(); if(!avg) return null;
  const C = cushion(), S = standingOrder(), D = dataProfile() || {}, M = MARKET;
  const lt = longTermPlace(P), asked = P.horizon && P.risk;
  const L = [];
  const HOW = HOW_TO;
  const howFor = howForPlace;
  if(avg.surplus <= 0) L.push(['bad', `בחודשים האחרונים יוצא יותר ממה שנכנס (בממוצע ${money(-avg.surplus)} בחודש). <b>קודם לצמצם הוצאות</b>, ורק אחר כך לחסוך.`, 'insights', 'איפה לחסוך']);
  else L.push(['good', `נשאר לכם בממוצע <b>${money(avg.surplus)} בחודש</b>. זה הכסף שאפשר לחסוך.`]);
  if((+P.debt||0) > 0) L.push(['bad', `<b>לסגור קודם את החוב של ${money(+P.debt)}.</b> הריבית עליו גבוהה מכל רווח בטוח.`, null, null, HOW.debt]);
  else if((D.interest||0) > 30) L.push(['bad', `אתם משלמים ריבית על מינוס, בערך ${money(D.interest)} בחודש. <b>לצאת מהמינוס</b> זה הרווח הכי בטוח שיש.`, null, null, HOW.debt]);
  if(C){
    if(!C.known) L.push(['warn', 'חסרה יתרת בנק, אז אי אפשר לדעת כמה כסף פנוי.', 'bank', 'ליתרה']);
    else if(C.missing > 0 && C.toCushion >= 500) L.push(['warn', `<b>להעביר עכשיו ${money(C.toCushion)} מהעו"ש לקרן כספית.</b> זו כרית הביטחון: כסף בצד למקרה לא צפוי. צריך בסך הכל ${money(C.target)} (${C.emMonths} חודשי הוצאות)${C.missing >= 500 ? `, ואת ${money(C.missing)} שעוד חסרים ימלא החיסכון החודשי` : ''}. בעו"ש נשארים ${money(C.keep)} לשוטף.`, null, null, HOW.kaspit]);
    else if(C.missing > 0) L.push(['warn', `<b>כרית ביטחון:</b> חסרים ${money(C.missing)} כדי להגיע ל-${money(C.target)} בצד. את זה ימלא החיסכון החודשי.`]);
    else L.push(['good', `<b>כרית הביטחון מלאה</b> (${money(C.have)}). ✓ לא צריך לעשות כלום.`]);
    if(C.toInvest >= 1000) L.push(['info', `<b>להעביר ${money(C.toInvest)} מהעו"ש ל${lt}.</b> זה כסף שאין לו תפקיד בעו"ש ולא צריך לכרית.`, null, null, howFor(lt)]);
  }
  if(S && S.amount >= 100) L.push(['info', `<b>לקבוע הוראת קבע של ${money(S.amount)} בחודש</b>, ב-${S.day} בכל חודש${S.payDay?' (יומיים אחרי המשכורת)':''}, ל${C && C.missing>0 ? 'קרן כספית. כשהכרית תתמלא, משנים אותה ל'+lt : lt}.`, null, null, C && C.missing>0 ? HOW.order : howFor(lt)]);
  if(!asked) L.push(['info', 'כדי שההמלצה תתאים לך, ענה על השאלות הקצרות למטה ("הפרטים שלך").']);
  return L;
}
function marketLine(){
  const M = MARKET, age = daysBetween(M.updated, todayStr());
  const real = Math.round((M.kaspitYield - M.inflation)*10)/10;
  const mean = real > 0
    ? `כסף בטוח (קרן כספית או פיקדון) מרוויח בערך ${M.kaspitYield}% בשנה, יותר מעליית המחירים (${M.inflation}%). אין צורך לקחת סיכון בשביל כסף שתצטרכו בקרוב.`
    : `הריבית נמוכה מעליית המחירים, אז גם כסף בטוח מאבד מעט מערכו. לכסף לטווח ארוך שווה לשקול קופת גמל להשקעה.`;
  const trend = M.trend==='down' ? ' הריבית צפויה לרדת: אם לא צריך את הכסף שנה, פיקדון לשנה "נועל" את הריבית של היום.' : M.trend==='up' ? ' הריבית צפויה לעלות: עדיף לא לנעול כסף לתקופה ארוכה.' : '';
  return `<div class="mkt"><div><b>מצב השוק</b> <span class="small muted">נכון ל-${fmtDate(M.updated)}${age>0?` (לפני ${age} ימים)`:''}</span>
      <div class="mkt-n"><span>ריבית <b>${M.boiRate}%</b></span><span>אינפלציה <b>${M.inflation}%</b></span><span>קרן כספית <b>~${M.kaspitYield}%</b></span></div>
      <div class="small">${mean}${trend}</div></div>
    <button class="btn" data-act="marketcheck">🔄 עדכן את מצב השוק</button></div>`;
}

  return `

        <div class="field"><label>ריבית בנק ישראל (%)</label><input type="number" id="mBoi" step="0.05" inputmode="decimal" value="${MARKET.boiRate}"><div class="small"><a href="https://www.boi.org.il/" target="_blank" rel="noopener noreferrer">איפה רואים? באתר בנק ישראל ↗</a> (מופיע בראש העמוד)</div></div>
        <div class="field"><label>אינפלציה בשנה האחרונה (%)</label><input type="number" id="mInf" step="0.1" inputmode="decimal" value="${MARKET.inflation}"><div class="small"><a href="https://www.cbs.gov.il/" target="_blank" rel="noopener noreferrer">איפה רואים? באתר הלמ"ס ↗</a> ("מדד המחירים לצרכן", השינוי ב-12 חודשים)</div></div>
        <div class="field"><button class="btn primary" data-act="marketsave">עדכן</button> <button class="btn" data-act="marketclose">סגור</button></div>

      <div class="small muted" style="margin-top:8px">🔒 הקישורים רק פותחים את האתר בדפדפן. התוכנה עצמה לא שולחת ולא מקבלת שום דבר מהאינטרנט, והנתונים שלכם לא יוצאים מהמחשב. העמוד יחשב מחדש מה לעשות לפי המספרים החדשים.
      ${db.settings.marketOverride?'<br><button class="linkbtn" data-act="marketreset">לחזור לנתונים שבקובץ</button>':''}
      <br>אפשרות נוספת: לכתוב לי בפרויקט "עדכן את מצב השוק", ואני אעדכן גם את התחזית וההערות.</div></div>` : ''}
  </div>
  <details class="fold" ${P.horizon?'':'open'}><summary>👤 הפרטים שלך (משפיעים על ההמלצה)</summary>
  <div class="card">
    <p class="small muted">התשובות נשמרות רק במחשב הזה. ${avg?`לפי ${avg.months} החודשים האחרונים: נכנס בממוצע ${money(avg.income)}, יוצא ${money(avg.expense)}, נשאר ${money(avg.surplus)} בחודש.`:'כשיהיו נתוני הכנסות והוצאות, אחשב לבד כמה נשאר לך כל חודש.'}</p>
    <div class="form">

function dataProfile(){
  const ms = monthsWithData().slice(-3);
  if(!ms.length) return null;
  const st = ms.map(monthStats);
  const incs = st.map(x=>x.income);
  const avgInc = incs.reduce((a,b)=>a+b,0)/incs.length;
  const sd = Math.sqrt(incs.reduce((a,b)=>a+(b-avgInc)**2,0)/incs.length);
  const n = ms.length;
  const catAvg = {}, incCat = {};
  st.forEach(x=>{ for(const [c,v] of Object.entries(x.byCat)) catAvg[c]=(catAvg[c]||0)+v/n; for(const [c,v] of Object.entries(x.incByCat)) incCat[c]=(incCat[c]||0)+v/n; });
  const inMs = t => ms.includes(ymOf(t.date));
  const interest = db.tx.filter(t=>inMs(t) && t.type==='expense' && /ריבית/.test(t.description)).reduce((a,t)=>a+t.amount,0)/n;
  const rec = findRecurring();
  const fixedCuttable = rec.filter(r=>['מנויים ושירותים דיגיטליים','תקשורת (טלפון / אינטרנט / טלוויזיה)','ביטוחים','עמלות בנק וריביות'].includes(r.cat));
  return {
    months:n, avgInc, variable: avgInc>0 && sd/avgInc > 0.2,
    business: (incCat['הכנסה מעסק']||0) > 0,
    kidsAllowance: db.tx.some(t=>inMs(t) && t.type==='income' && /ילד/.test(t.description)),
    loans: catAvg['החזר הלוואות']||0, interest,
    savingNow: st.reduce((a,x)=>a+x.savings,0)/n,
    catAvg, incCat, fixedCuttable,
    cuttableTotal: fixedCuttable.reduce((a,r)=>a+r.avg,0),
  };
}
function dataCard(D, avg){
  if(!D) return '';
  const pct = c => D.avgInc ? Math.round((D.catAvg[c]||0)/D.avgInc*100) : 0;
  const items = [];
  const incList = Object.entries(D.incCat).filter(([c])=>!NOT_COUNTED.has(c)).sort((a,b)=>b[1]-a[1]);
  if(incList.length) items.push(`<li><b>ההכנסות שלך:</b> ${incList.map(([c,v])=>`${esc(c)} ${money(v)}`).join(', ')} בחודש בממוצע. ${D.variable?'ההכנסה <b>משתנה</b> מחודש לחודש, לכן כדאי קרן חירום גדולה יותר (6 חודשים).':'ההכנסה <b>יציבה</b> יחסית.'}</li>`);
  if(avg) items.push(`<li><b>נשאר לך בממוצע ${money(avg.surplus)} בחודש</b>${D.savingNow?`, ובנוסף אתה כבר מפקיד לחיסכון ${money(D.savingNow)} בחודש`:''}.</li>`);
  const hous = pct('דיור (שכירות / משכנתא)');
  if(hous>=35) items.push(`<li>הדיור לוקח <b>${hous}%</b> מההכנסה. זה גבוה (מקובל עד כשליש), ולכן חשוב במיוחד לשמור על קרן חירום.</li>`);
  if(D.loans) items.push(`<li>אתה משלם <b>${money(D.loans)}</b> בחודש החזרי הלוואות. אם הריבית עליהן גבוהה, פירעון מוקדם עדיף על השקעה. כדאי לבקש מהבנק את הריבית המדויקת.</li>`);
  if(D.interest) items.push(`<li>ראיתי חיובי <b>ריבית</b> של בערך ${money(D.interest)} בחודש. זה סימן למינוס, וסגירתו היא הצעד הראשון.</li>`);
  if(D.cuttableTotal) items.push(`<li>יש לך <b>${money(D.cuttableTotal)}</b> בחודש בחיובים קבועים של תקשורת, מנויים, ביטוחים ועמלות (${D.fixedCuttable.slice(0,4).map(r=>esc(r.name)).join(', ')}${D.fixedCuttable.length>4?' ועוד':''}). חיסכון של רבע מזה הוא בערך <b>${money(D.cuttableTotal*0.25)}</b> בחודש, כלומר <b>${money(D.cuttableTotal*3)}</b> בשנה שאפשר להעביר לחיסכון.</li>`);
  if(D.kidsAllowance) items.push(`<li>נכנסת קצבת ילדים, אז כדאי לוודא שהגדרת את <b>"חיסכון לכל ילד"</b> (פירוט בתוכנית למטה).</li>`);
  return `<div class="card"><h2>מה ראיתי בנתונים שלך</h2><p class="small muted">לפי ${D.months} החודשים האחרונים שיש בהם נתונים. ההמלצות למטה מותאמות לזה.</p><ul>${items.join('')}</ul></div>`;
}
function marketCard(P, avg, D){
  const M = MARKET;

  if(real > 0.75) tips.push(`<b>הכסף הבטוח מרוויח יותר מהאינפלציה</b> (ריבית ${M.boiRate}% מול אינפלציה ${M.inflation}%). לכן כסף שיושב בעו"ש בלי ריבית "מפסיד" ממש, ושווה להעביר אותו לקרן כספית או לפיקדון.`);
  else tips.push(`הריבית (${M.boiRate}%) קרובה לאינפלציה (${M.inflation}%), כך שהכסף הבטוח בקושי שומר על ערכו. לחיסכון לטווח ארוך שווה לשקול רכיב מנייתי קטן לפי רמת הסיכון שלך.`);
  if(surplus > 0){

  }

  if(M.trend==='down' && (P.horizon==='mid' || P.risk==='low')) tips.push(`<b>הריבית בירידה:</b> כסף שלא תצטרך בשנה-שנתיים הקרובות אפשר "לנעול" בפיקדון בריבית קבועה (בערך ${M.depositRange} כרגע) לפני שהריבית תרד עוד. את קרן החירום משאירים נזילה, בקרן כספית.`);

    `${surplus>0&&target&&savings<target?`עם ${money(surplus)} שנשארים לך בחודש, קודם משלימים את קרן החירום. בקצב הזה זה ייקח בערך ${Math.ceil((target-savings)/surplus)} חודשים. אחרי זה מתחילים להשקיע. `:''}
    ${D.cuttableTotal?`אם תוריד גם רבע מהחיובים הקבועים (תקשורת, מנויים, ביטוחים), יתווספו עוד בערך ${money(D.cuttableTotal*0.25)} בחודש. `:''}
    לפי מה שענית, חלוקה שמרנית אפשרית:<ul>${alloc.map(([n,p])=>`<li>${n}: ${p}%${surplus>0?` (בערך ${money(surplus*p/100)} בחודש)`:''}</li>`).join('')}</ul>
    הדרך הפשוטה והזולה היא <b>קופת גמל להשקעה</b> או <b>קרן מחקה מדד</b> עם דמי ניהול נמוכים, ולהפקיד סכום קבוע כל חודש. לא מנסים לנחש את השוק, ולא מוכרים בבהלה כשיש ירידות.
    ${P.horizon==='short'?'<br>כיוון שתצטרך את הכסף בקרוב, לא כדאי לשים אותו במניות בכלל.':''}`);
  if(age && age<67) add(false, 'פנסיה', 'ודא שיש לך קרן פנסיה פעילה עם דמי ניהול נמוכים (אפשר לבקש הנחה או לעבור לקרן ברירת מחדל זולה). זה החיסכון הגדול ביותר שלך לטווח ארוך.');
  return `<div class="card"><h2>התוכנית שלך, צעד אחרי צעד</h2>
    ${steps.map((s,i)=>`<div class="step ${s.cls}"><div class="n">${s.cls==='done'?'✓':i+1}</div><div><b>${s.title}</b><div>${s.body}</div></div></div>`).join('')}
    <div class="tip info"><b>נקודה הלכתית</b>פיקדונות ואג"ח בבנקים ובחברות בישראל עובדים בדרך כלל עם "היתר עסקה" בגלל איסור ריבית. אם זה חשוב לך, כדאי לוודא מול הגוף שיש היתר עסקה, ולשאול רב במקרה של ספק.</div>
  </div>`;
}

// ---------- כלים להשקעות ----------
// חלוקה מומלצת לכסף הפנוי לפי התשובות בלשונית "השקעות"
function allocFor(P){
  return P.horizon==='short' ? [['קרן כספית / פיקדון',100]]
    : P.risk==='low' ? (P.horizon==='long' ? [['אג"ח ממשלתי / קרן כספית',75],['קרן מחקה מדד רחב (מניות)',25]] : [['קרן כספית / פיקדון',60],['אג"ח ממשלתי קצר',40]])
    : P.risk==='mid' ? (P.horizon==='long' ? [['אג"ח ממשלתי',55],['קרן מחקה מדד רחב (מניות)',45]] : [['קרן כספית / פיקדון',40],['אג"ח ממשלתי',45],['קרן מחקה מדד רחב',15]])
    : (P.horizon==='long' ? [['קרן מחקה מדד רחב (מניות)',60],['אג"ח ממשלתי',40]] : [['אג"ח ממשלתי',60],['קרן מחקה מדד רחב',40]]);
}
const stockShare = alloc => alloc.filter(([n])=>/מניות|מדד/.test(n)).reduce((s,[,p])=>s+p,0);

// 2. מחשבון עתיד
const depositMid = () => { const n = String(MARKET.depositRange).match(/[\d.]+/g)||[]; return n.length ? n.reduce((a,b)=>a+ +b,0)/n.length : MARKET.kaspitYield; };
function futureOptions(){
  const L = MARKET.longReturns || {};
  return [
    {k:'kaspit', name:'קרן כספית', ret:MARKET.kaspitYield, fee:0, tax:25, risk:'נמוך מאוד', note:'אפשר למשוך תוך יום. הריבית משתנה עם ריבית בנק ישראל.'},
    {k:'deposit', name:'פיקדון בבנק', ret:depositMid(), fee:0, tax:15, risk:'נמוך מאוד', note:'ריבית קבועה לתקופה. משיכה מוקדמת עולה בריבית.'},
    {k:'gemel', name:'קופת גמל להשקעה (מסלול כללי)', ret:L.general??4.5, fee:0.65, tax:25, risk:'בינוני', note:'יש עליות וירידות בדרך. בגיל 60 אפשר למשוך כקצבה בלי מס.'},
    {k:'index', name:'קרן מחקה מדד (מניות)', ret:L.stocks??6.5, fee:0.3, tax:25, risk:'גבוה בטווח קצר', note:'לאורך שנים עלתה בדרך כלל, אבל יש שנים של ירידה של 20% עד 30%. רק לכסף שלא צריך בקרוב.'},
  ];
}
function simulate(o, start, monthly, years){
  const rm = (o.ret - o.fee)/100/12;
  let v = start, paid = start; const path = [start];
  for(let m=1;m<=years*12;m++){ v = v*(1+rm) + monthly; paid += monthly; if(m%12===0) path.push(v); }
  const gain = Math.max(0, v - paid), net = v - gain*o.tax/100;
  const real = net / Math.pow(1+(MARKET.inflation||0)/100, years);
  return {net, paid, gain: gain*(1-o.tax/100), real, path: path.map((x,i)=>{ const p = start + monthly*12*i; return x - Math.max(0,x-p)*o.tax/100; })};
}
let fut = null;
function futureCard(){
  if(!fut){
    const S = standingOrder(), avg = averages();
    fut = {monthly: S && S.amount ? S.amount : avg && avg.surplus>0 ? Math.floor(avg.surplus/2/100)*100 : 500, start: 0, years: 10};

  const x = i => pad + (W-pad*2) * i / fut.years, y = v => H - 24 - (H-48) * v / maxV;
  const lines = opts.map((o,j)=>`<polyline fill="none" stroke="${colors[j]}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${o.r.path.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`).join('');
  const grid = [0,.5,1].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${y(maxV*f)}" y2="${y(maxV*f)}" stroke="var(--line)"/><text x="${W-pad+4}" y="${y(maxV*f)+4}" font-size="11" fill="var(--muted)">${f?Math.round(maxV*f/1000)+'K':'0'}</text>`).join('');
  const ticks = Array.from({length:fut.years+1},(_,i)=>i).filter(i=>i%(fut.years>10?5:fut.years>5?2:1)===0).map(i=>`<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${i===0?'היום':i}</text>`).join('');
  return `<div class="card"><h2>🔮 מחשבון עתיד: כמה יהיה לכם</h2>
    <p class="small muted">בחרו כמה לחסוך כל חודש ולכמה זמן, ותראו כמה יהיה בכל אפשרות. החישוב כולל דמי ניהול ומס על הרווח. התשואות הן הערכה לפי מה שמקובל היום, לא הבטחה.</p>
    <div class="form">
      <div class="field"><label>חיסכון חודשי ₪</label><input type="number" id="fMon" value="${fut.monthly}" min="0" step="100" inputmode="decimal"></div>
      <div class="field"><label>סכום להתחלה ₪</label><input type="number" id="fStart" value="${fut.start}" min="0" step="1000" inputmode="decimal"></div>
      <div class="field"><label>לכמה זמן</label><select id="fYears">${[3,5,10,15,20,30].map(n=>`<option value="${n}" ${n===fut.years?'selected':''}>${n} שנים</option>`).join('')}</select></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:14px;direction:ltr" role="img" aria-label="גרף צמיחת החיסכון">${grid}${lines}${ticks}</svg>
    <div class="small muted" style="text-align:center">שנים מהיום</div>
    <div class="legend" style="flex-wrap:wrap">${opts.map((o,j)=>`<span><i style="background:${colors[j]}"></i>${esc(o.name)}</span>`).join('')}</div>
    <div class="tablewrap" style="margin-top:12px"><table><tr><th>אפשרות</th><th class="num">אחרי ${fut.years} שנים</th><th class="num">מתוך זה רווח</th><th class="num">בכסף של היום</th><th>סיכון</th></tr>
      ${opts.map(o=>`<tr><td><b>${esc(o.name)}</b><div class="small muted">${esc(o.note)} תשואה משוערת ${o.ret.toFixed(1)}% בשנה${o.fee?`, דמי ניהול ${o.fee}%`:''}, מס ${o.tax}% על הרווח.</div></td>
        <td class="num">${money(o.r.net)}</td><td class="num pos">${money(o.r.gain)}</td><td class="num muted">${money(o.r.real)}</td><td class="small">${o.risk}</td></tr>`).join('')}
    </table></div>
    <p class="small muted">הפקדתם בסך הכל ${money(fut.start + fut.monthly*12*fut.years)}. "בכסף של היום" אומר כמה זה שווה אחרי עליית מחירים של ${MARKET.inflation}% בשנה.</p>
  </div>`;

// 3. מגירה לכל מטרה: איפה לשמור את הכסף לפי מתי צריך אותו
function goalDrawer(months, P){
  P = P || db.profile;
  const down = MARKET.trend==='down';
  if(months <= 12) return {icon:'💧', name:'קרן כספית', why:'צריך את הכסף בשנה הקרובה, אז רק מקום בטוח שאפשר למשוך ממנו תוך יום.'};
  if(months <= 36) return {icon:'🔒', name:'פיקדון או אג"ח ממשלתי קצר', why:`צריך את הכסף בעוד ${Math.round(months/12*10)/10} שנים. פיקדון שמסתיים לפני מועד הקנייה נותן ריבית קבועה (בערך ${MARKET.depositRange}).${down?' הריבית בירידה, ולכן נעילה עכשיו שומרת על הריבית הנוכחית.':''}`};
  if(months <= 72) return {icon:'🛡️', name:'קופת גמל להשקעה, מסלול סולידי', why:'בטווח של 3 עד 6 שנים אפשר קצת יותר תשואה, אבל עדיין בלי הרבה מניות.'};
  return P.risk==='low'
    ? {icon:'🌱', name:'קופת גמל להשקעה, מסלול כללי', why:'זה רחוק, אז אפשר לקבל ירידות זמניות. בחרתם סיכון נמוך, לכן מסלול כללי ולא מנייתי.'}
    : {icon:'🌳', name:'קופת גמל להשקעה או קרן מחקה מדד', why:'יותר מ-6 שנים: לאורך זמן מניות נתנו בדרך כלל יותר, והזמן מאפשר לחכות לירידות שיעברו.'};
}
function goalMonths(g){
  const nowYm = todayStr().slice(0,7), left = Math.max(0, g.amount - goalSaved(g));
  if(g.date) return Math.max(1, monthsBetween(nowYm, g.date.slice(0,7)));
  return g.monthly ? Math.ceil(left/g.monthly) : 12;
}
function drawersCard(){
  const open = db.goals.filter(g=>goalSaved(g) < g.amount);
  if(!open.length) return '';
  const groups = {};
  open.forEach(g=>{ const d = goalDrawer(goalMonths(g)); (groups[d.name] = groups[d.name] || {d, goals:[], sum:0}).goals.push(g); groups[d.name].sum += goalSaved(g); });
  return `<div class="card"><h2>🗄️ המגירות שלכם: איפה לשמור את הכסף לכל מטרה</h2>
    <p class="small muted">כל מטרה מקבלת "מגירה" לפי מתי תצטרכו את הכסף. ככל שהמטרה רחוקה יותר, אפשר לקבל יותר תשואה.</p>
    <div class="grid">${Object.values(groups).map(G=>`<div class="stat"><div class="lbl">${G.d.icon} ${esc(G.d.name)}</div>
      <div class="val" style="font-size:20px">${money(G.sum)}</div><div class="sub">${G.goals.map(g=>esc(g.name)).join(', ')}</div><div class="small" style="margin-top:6px">${G.d.why}</div></div>`).join('')}</div></div>`;
}

// 4. בדיקת חלוקה: איך הכסף מחולק היום מול ההמלצה
const EQ_DEFAULT = {stocks:100, gemel:40, hish:40, kaspit:0};
function allocationCheck(){
  const P = db.profile; if(!P.risk || !P.horizon) return {need:'profile'};
  const C = cushion();
  const keep = C ? C.keep : 0;
  let safe = Math.max(0, bankTotal() - keep), equity = 0;
  db.assets.forEach(a=>{ if(!(a.kind in EQ_DEFAULT)) return; const eq = (a.equity ?? EQ_DEFAULT[a.kind])/100, v = +a.amount||0; equity += v*eq; safe += v*(1-eq); });
  const cushionNeed = C ? C.target : 0;
  const investable = Math.max(0, safe + equity - cushionNeed);
  if(safe + equity <= 0) return {need:'assets'};
  const tgtPct = stockShare(allocFor(P));
  const nowPct = investable > 0 ? Math.round(equity / investable * 100) : 0;
  let next;
  if(C && C.missing > 0) next = {to:'קרן כספית (כרית ביטחון)', why:`קודם משלימים את כרית הביטחון. חסרים בה ${money(C.missing)}.`};
  else if(nowPct < tgtPct - 7) next = {to:'קרן מחקה מדד או קופת גמל במסלול מנייתי', why:`יש לכם פחות מניות ממה שמתאים לכם (${nowPct}% במקום ${tgtPct}%).`};
  else if(nowPct > tgtPct + 7) next = {to:'אג"ח ממשלתי, פיקדון או קרן כספית', why:`יש לכם יותר מניות ממה שמתאים לרמת הסיכון שבחרתם (${nowPct}% במקום ${tgtPct}%).`};
  else next = {to:'לפי החלוקה הרגילה', why:'החלוקה שלכם קרובה למה שמתאים לכם. ממשיכים להפקיד לפי אותם אחוזים.'};
  return {nowPct, tgtPct, investable, cushionNeed, equity, safe, next};
}
function allocationCard(){
  const A = allocationCheck();
  if(A.need==='profile') return `<div class="card"><h2>⚖️ בדיקת חלוקה</h2><p class="small">כדי לבדוק אם הכסף מחולק נכון, ענו קודם על השאלות הקצרות בלשונית "השקעות".</p><button class="btn sm" data-goto="invest">לשאלות ←</button></div>`;
  if(A.need==='assets') return `<div class="card"><h2>⚖️ בדיקת חלוקה</h2><p class="small">הוסיפו למעלה את החסכונות (קרן כספית, קופת גמל, תיק השקעות), ואבדוק אם החלוקה מתאימה לכם.</p></div>`;
  const bar = (pct, label, col) => `<div class="b"><div class="bl"><span>${label}</span><span>${pct}% מניות</span></div><div class="bt"><div class="bf" style="width:${pct}%;background:${col}"></div></div></div>`;
  return `<div class="card"><h2>⚖️ בדיקת חלוקה</h2>
    <p class="small muted">בודק את הכסף שמעבר לכרית הביטחון (${money(A.investable)}), בלי פנסיה וחיסכון לילדים. מסלול כללי נחשב כ-40% מניות, אלא אם כתבתם אחרת.</p>
    <div class="bars">${bar(A.nowPct,'היום','var(--primary)')}${bar(A.tgtPct,'מה שמתאים לכם','var(--green)')}</div>
    <div class="tip info"><b>הכסף הבא הולך ל: ${A.next.to}</b>${A.next.why} כך מאזנים בלי למכור כלום ובלי לשלם מס.</div>
  </div>`;
}

// 5. התראות לפי מצב השוק, מותאמות לנתונים שלכם
function marketAlerts(){
  const M = MARKET, prev = M.prev || {}, out = [];
  const C = cushion();
  const hasLoan = db.assets.some(a=>ASSET_KINDS[a.kind]?.debt) || db.tx.some(t=>/משכנתא|הלוואה/.test(t.description));
  const hasMortgage = db.assets.some(a=>a.kind==='mortgage') || db.tx.some(t=>/משכנתא/.test(t.description));
  const extra = C ? C.idle + C.safe - C.target : 0;
  const rateMove = prev.boiRate!=null ? M.boiRate - prev.boiRate : 0;
  if(rateMove < 0) out.push(['info', `<b>הריבית ירדה ל-${M.boiRate}%</b> (הייתה ${prev.boiRate}%). התשואה בקרן כספית תרד לאט.${extra>2000?` יש לכם בערך ${money(extra)} מעבר לכרית הביטחון: אם לא תצטרכו אותם בשנה-שנתיים, שווה לנעול פיקדון עכשיו (בערך ${M.depositRange}).`:''}`]);
  if(rateMove > 0) out.push(['info', `<b>הריבית עלתה ל-${M.boiRate}%</b>. עדיף לא לנעול כסף לתקופה ארוכה, וקרן כספית תרוויח יותר בקרוב.`]);
  if(rateMove < 0 && hasMortgage) out.push(['good', '<b>המשכנתא:</b> הריבית ירדה, אז מסלול הפריים מתוזל. שווה לבדוק מחזור משכנתא מול כמה בנקים.']);
  if(rateMove > 0 && hasLoan) out.push(['warn', '<b>ההלוואות:</b> הריבית עלתה, אז הלוואה בריבית משתנה התייקרה. שווה לשקול להקדים פירעון.']);
  if(M.inflation > 3) out.push(['warn', `<b>האינפלציה גבוהה (${M.inflation}%).</b> כסף שיושב בלי ריבית מאבד מערכו. שווה לשקול אג"ח צמוד מדד לחלק מהחיסכון.`]);
  if(M.boiRate - M.inflation < 0) out.push(['warn', '<b>הריבית נמוכה מהאינפלציה:</b> גם בקרן כספית הכסף שומר רק בקושי על ערכו.']);
  if(M.nextDecision){ const d = daysBetween(todayStr(), M.nextDecision); if(d>=0 && d<=10) out.push(['info', `<b>בעוד ${d} ימים (${fmtDate(M.nextDecision)}) בנק ישראל מחליט על הריבית.</b> אם אתם מתלבטים על פיקדון ארוך, אפשר לחכות להחלטה.`]); }
  if(C && C.idle >= 3000) out.push(['info', `<b>${money(C.idle)} יושבים בעו"ש בלי ריבית.</b> בריבית של היום זה ${money(C.idle*M.kaspitYield/100)} בשנה שאתם מפסידים.`]);
  return out;
}
function marketAlertsCard(dash){
  const A = marketAlerts();
  if(!A.length) return '';
  if(dash && db.settings.marketSeen === MARKET.updated) return '';
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📣 מה השינויים בשוק אומרים בשבילכם</h2>${dash?'<button class="btn sm" data-act="marketseen">הבנתי</button>':''}</div>

document.addEventListener('toggle', e=>{
  const d = e.target; if(!(d instanceof HTMLDetailsElement) || !d.classList.contains('rowmenu') || !d.open) return;
  window._rmT = Date.now();
  document.querySelectorAll('details.rowmenu[open]').forEach(x=>{ if(x!==d) x.open = false; });
  const r = d.querySelector('summary').getBoundingClientRect(), m = d.querySelector('.menu');
  const h = m.offsetHeight, w = m.offsetWidth;
  m.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  m.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
}, true);
document.addEventListener('click', e=>{ if(!e.target.closest('details.rowmenu')) document.querySelectorAll('details.rowmenu[open]').forEach(x=>x.open = false); });
window.addEventListener('scroll', ()=>Date.now()-(window._rmT||0)>250 && document.querySelectorAll('details.rowmenu[open]').forEach(x=>x.open = false), true);
function decorate(){
  const hb = document.querySelector('[data-act=helpshow]');
  if(hb){ hb.classList.toggle('on', !!db.settings.helpMode); hb.title = db.settings.helpMode ? 'הסתר הסברים' : 'הצג הסברים על המסך הזה'; }
  document.body.classList.toggle('help', !!db.settings.helpMode);
  document.querySelectorAll('#main .card > h2 + p.small, #main .card > .row + p.small').forEach(el=>{
    const t = el.textContent.trim(); if(HINTS.some(h=>t.startsWith(h))) el.classList.add('hint'); });
  if(!db.settings.helpMode) return;
  document.querySelectorAll('#main .stat .lbl, #main .card > h2, #main .card > .row > h2').forEach(el=>{
    if(el.dataset.dec) return; el.dataset.dec = 1;
    const txt = cleanLabel(el.textContent);
    const key = Object.keys(EXPLAIN).find(k=>txt===k || txt.startsWith(k));
    if(!key) return;
    const b = document.createElement('button'); b.className = 'info'; b.type = 'button'; b.textContent = 'ⓘ'; b.title = 'מה זה?';
    b.dataset.explain = key; el.appendChild(b);
  });
}

const ASSET_KINDS = {
  kaspit:   {label:'קרן כספית / פיקדון', liquid:true},
  hish:     {label:'קרן השתלמות', fee:'hish'},
  pension:  {label:'קרן פנסיה', fee:'pension', dep:true},
  menahalim:{label:'ביטוח מנהלים', fee:'menahalim', dep:true},
  gemel:    {label:'קופת גמל להשקעה', fee:'gemel'},
  kids:     {label:'חיסכון לכל ילד'},
  stocks:   {label:'תיק השקעות / מניות'},
  other:    {label:'נכס אחר (דירה, רכב וכו\')'},
  loan:     {label:'הלוואה (כמה נשאר להחזיר)', debt:true},
  mortgage: {label:'משכנתא (כמה נשאר להחזיר)', debt:true},
};
const bankTotal = () => Object.values(db.balances||{}).reduce((s,b)=>s+(+b.amount||0),0);
const hasBank = () => Object.keys(db.balances||{}).length > 0;
const liquidAssets = () => db.assets.filter(a=>ASSET_KINDS[a.kind]?.liquid).reduce((s,a)=>s+(+a.amount||0),0);
function liquidTotal(){ return bankTotal() + liquidAssets(); }
function netWorth(){
  let assets = bankTotal(), debts = 0;
  db.assets.forEach(a=>{ if(ASSET_KINDS[a.kind]?.debt) debts += +a.amount||0; else assets += +a.amount||0; });
  return {assets, debts, net: assets-debts};
}
function snapWorth(){
  if(!db.assets.length && !hasBank()) return;
  const ym = todayStr().slice(0,7), v = Math.round(netWorth().net);
  if(db.worth[ym] !== v){ db.worth[ym] = v; save(); }
}

// כרית ביטחון: כמה צריך בצד, כמה יש, וכמה כסף יושב בעו"ש בלי ריבית
function cushion(){
  const avg = averages(); if(!avg || !avg.expense) return null;
  const D = dataProfile() || {}, P = db.profile;
  const emMonths = (P.work==='self' || P.work==='both' || D.business || D.variable) ? 6 : 4;
  const target = Math.round(avg.expense*emMonths/1000)*1000;
  const bank = bankTotal(), known = hasBank();
  const keep = Math.ceil(avg.expense*1.2/500)*500;          // לעו"ש מספיק חודש של הוצאות ועוד קצת
  const idle = known ? Math.max(0, bank - keep) : 0;         // כסף שיושב בעו"ש סתם
  const safe = liquidAssets();                                // כבר בקרן כספית / פיקדון
  const have = safe + idle;
  const missing = Math.max(0, target - have);
  const toCushion = Math.max(0, Math.min(idle, target - safe));
  const toInvest = Math.max(0, idle - toCushion);
  return {emMonths, target, bank, known, keep, idle, safe, have, missing, toCushion, toInvest, monthlyExp:avg.expense};
}
function cushionCard(compact){
  const C = cushion();
  if(!C) return compact ? '' : '<div class="card"><h2>🛟 כרית ביטחון</h2><div class="empty">כשיהיו נתוני הוצאות, אחשב כמה כסף כדאי להחזיק בצד.</div></div>';
  if(!C.known && compact) return '';
  const pct = C.target ? Math.min(100, Math.round(C.have/C.target*100)) : 0;
  if(compact) return `<div class="card"><h2>🛟 כרית ביטחון</h2>
    <div class="bars"><div class="b"><div class="bl"><span>יש בצד ${money(C.have)} מתוך ${money(C.target)} (${C.emMonths} חודשי הוצאות)</span><span>${pct}%</span></div><div class="bt"><div class="bf" style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--primary)'}"></div></div></div></div>
    <button class="btn sm" data-goto="wealth" style="margin-top:8px">מה לעשות ←</button></div>`;

// הוראת קבע לחיסכון: סכום שמרני שאפשר לחסוך כל חודש בלי להיכנס למינוס
function standingOrder(){
  let ms = monthsWithData();
  const cur = todayStr().slice(0,7);
  if(ms[ms.length-1]===cur && ms.length>1) ms = ms.slice(0,-1);   // החודש הנוכחי עוד לא נגמר
  ms = ms.slice(-6);
  if(!ms.length) return null;
  const left = ms.map(m=>monthStats(m).balance).sort((a,b)=>a-b);
  const careful = left.length>=3 ? left[1] : left[0];               // חודש חלש, לא הממוצע
  const goals = committedPerMonth();
  const annual = db.annual.reduce((s,a)=>s+(+a.amount||0)/12,0);
  const amount = Math.max(0, Math.floor((careful*0.8 - goals - annual)/100)*100);
  // באיזה יום נכנסת המשכורת
  const sal = db.tx.filter(t=>t.type==='income' && !NOT_COUNTED.has(t.category) && t.amount>=1000);
  const days = {}; sal.forEach(t=>{ const d = +t.date.slice(8,10); days[d]=(days[d]||0)+t.amount; });
  const payDay = Object.keys(days).length ? +Object.entries(days).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const day = payDay ? Math.min(28, payDay+2) : 10;
  const C = cushion();
  return {months:ms.length, careful, goals, annual, amount, payDay, day, toCushion: !C || C.missing>0};
}

// בדיקת דמי ניהול מול מה שמקובל היום
function feeCheck(a){
  const k = ASSET_KINDS[a.kind]; if(!k || !k.fee) return null;
  const B = MARKET.fees[k.fee]; if(!B) return null;
  const acc = a.feeAcc===''||a.feeAcc==null ? null : +a.feeAcc;
  const dep = a.feeDep===''||a.feeDep==null ? null : +a.feeDep;
  if(acc===null && dep===null) return {missing:true, B};
  const bal = +a.amount||0, monthly = +a.monthly||0;
  let extraYear = 0;
  if(acc!==null && acc > B.acc) extraYear += bal*(acc-B.acc)/100;
  if(dep!==null && B.dep!=null && dep > B.dep) extraYear += monthly*12*(dep-B.dep)/100;
  // לאורך 20 שנה, עם תשואה משוערת של 4% בשנה
  let mine = bal, good = bal;
  for(let y=0;y<20;y++){
    mine = mine*(1+0.04-(acc!==null?acc:B.acc)/100) + monthly*12*(1-(dep!==null?dep:(B.dep||0))/100);
    good = good*(1+0.04-B.acc/100) + monthly*12*(1-(B.dep||0)/100);
  }
  return {B, acc, dep, high: extraYear > 50, extraYear, extra20: Math.max(0, good-mine)};
}
function feesCard(){
  const list = db.assets.filter(a=>ASSET_KINDS[a.kind]?.fee);
  if(!list.length) return `<div class="card"><h2>💸 בדיקת דמי ניהול</h2><p class="small">הוסף למטה קרן פנסיה, קרן השתלמות או קופת גמל, עם דמי הניהול שמופיעים בדוח השנתי שלה (או באתר "הר הכסף" / "גמל נט"), ואבדוק אם אתם משלמים יותר מדי.</p></div>`;
  const rows = list.map(a=>{
    const F = feeCheck(a); const B = F.B;
    const good = `מקובל היום: עד ${B.acc}% מהצבירה${B.dep!=null?` ועד ${B.dep}% מההפקדה`:''}`;
    if(F.missing) return `<div class="tip info"><span><b style="display:inline">${esc(a.name)}:</b> לא הוזנו דמי ניהול. ${good}.</span></div>`;
    if(!F.high) return `<div class="tip good"><span><b style="display:inline">${esc(a.name)}: דמי הניהול בסדר 👍</b> ${good}.</span></div>`;
    return `<div class="tip warn"><span><b style="display:inline">${esc(a.name)}: דמי הניהול גבוהים.</b> אתם משלמים ${F.acc!==null?F.acc+'% מהצבירה':''}${F.acc!==null&&F.dep!==null?' ו-':''}${F.dep!==null?F.dep+'% מההפקדה':''}. ${good}.
      ההפרש עולה לכם בערך <b>${money(F.extraYear)} בשנה</b>, ובערך <b>${money(F.extra20)}</b> לאורך 20 שנה.</span></div>`;
  }).join('');
  const anyHigh = list.some(a=>feeCheck(a).high);
  return `<div class="card"><h2>💸 בדיקת דמי ניהול</h2>${rows}
    ${anyHigh?`<h3>איך מורידים</h3><ol>

      <li>אם לא, עוברים לחברה אחרת. המעבר בחינם, הכסף לא נפגע, וממלאים טופס אחד מול החברה החדשה.</li>
      <li>אפשר להשוות חברות ומסלולים באתר "גמל נט" או "פנסיה נט" של משרד האוצר.</li></ol>`:''}
    <p class="small muted">${esc(MARKET.fees.note)}</p></div>`;
}

// שינוי שם של חשבון בכל המקומות שהוא מופיע
function renameOwners(old, nw){
  const map = {}; old.forEach((o,i)=>{ if(o!==nw[i]) map[o] = nw[i]; });
  if(!Object.keys(map).length) return;
  db.tx.forEach(t=>{ if(map[t.owner]) t.owner = map[t.owner]; });
  db.imports.forEach(x=>{ if(map[x.owner]) x.owner = map[x.owner]; });
  db.assets.forEach(a=>{ if(map[a.owner]) a.owner = map[a.owner]; });
  const B = {}; for(const [o,b] of Object.entries(db.balances)){ const k = map[o]||o;
    if(B[k]) B[k] = {amount:(+B[k].amount)+(+b.amount), date: B[k].date>b.date?B[k].date:b.date, src:'manual'}; else B[k] = b; }
  db.balances = B;
}
function toggleFeeFields(){ const k = $('#aKind'); if(!k) return; const K = ASSET_KINDS[k.value]||{};
  document.querySelectorAll('[data-feef]').forEach((f,i)=>f.classList.toggle('hidden', !K.fee || (i===1 && !K.dep)));
  document.querySelectorAll('[data-eqf]').forEach(f=>f.classList.toggle('hidden', !['gemel','hish','stocks'].includes(k.value))); }

document.addEventListener('click', e=>{

  if(g){ document.querySelector(`#nav button[data-tab="${g.dataset.goto}"]`).click(); return; }
  const del = e.target.closest('[data-del]');

  const dr = e.target.closest('[data-delrule]');
  if(dr){ const r = db.maaserRules.find(x=>x.id==dr.dataset.delrule); if(r && confirm(`למחוק את הכלל עבור "${r.match}"?`)){ db.maaserRules = db.maaserRules.filter(x=>x!==r); save(); render(); } return; }
  const tv = e.target.closest('[data-txview]'); if(tv){ txView = tv.dataset.txview; render(); return; }
  const ex = e.target.closest('[data-explain]');
  if(ex){ const host = ex.closest('.stat') ? ex.parentElement : ex.closest('h2');
    const nxt = host.nextElementSibling;
    if(nxt && nxt.classList.contains('explain')) nxt.remove();
    else { const d = document.createElement('div'); d.className = 'explain'; d.textContent = EXPLAIN[ex.dataset.explain]; host.after(d); }
    return; }
  const md = e.target.closest('[data-mdel]');
  if(md){ if(confirm('למחוק את הרישום?')){ db.maaserManual = db.maaserManual.filter(x=>x.id!=md.dataset.mdel); save(); render(); } return; }
  const dp = e.target.closest('[data-delperson]');
  if(dp){ const i = +dp.dataset.delperson, name = db.settings.people[i];
    const n = db.tx.filter(t=>t.owner===name).length;
    if(!confirm(n ? `לחשבון "${name}" יש ${n} תנועות. הן לא יימחקו, אלא יעברו ל"${JOINT}". להסיר את החשבון?` : `להסיר את החשבון "${name}"?`)) return;
    db.settings.people.splice(i,1);
    renameOwners([name],[JOINT]); save(); render(); toast('הוסר ✓'); return; }
  const ae = e.target.closest('[data-aedit]'); if(ae){ assetEdit = +ae.dataset.aedit; render(); return; }
  const adl = e.target.closest('[data-adel]'); if(adl){ if(confirm('למחוק?')){ db.assets = db.assets.filter(x=>x.id!=adl.dataset.adel); save(); render(); } return; }
  const yb = e.target.closest('[data-year]'); if(yb){ curYear = yb.dataset.year; render(); return; }
  const sp = e.target.closest('[data-split]');
  if(sp){ splitId = splitId==sp.dataset.split ? null : +sp.dataset.split; ruleId = null; render(); return; }
  const bd = e.target.closest('[data-baldel]');
  if(bd){ const o = bd.dataset.baldel; if(confirm(`להסיר את היתרה של "${o}"? התנועות עצמן לא נמחקות.`)){ delete db.balances[o]; save(); render(); toast('היתרה הוסרה'); } return; }
  const io = e.target.closest('[data-iown]');
  if(io){ $('#iOwner').value = io.dataset.iown; document.querySelectorAll('[data-iown]').forEach(b=>b.classList.toggle('on', b===io)); previewImport(); return; }
  const nb = e.target.closest('[data-note]');
  if(nb){ const t = db.tx.find(x=>x.id==nb.dataset.note); if(!t) return;
    const v = prompt('פירוט לתנועה "'+t.description+'" ('+money(t.amount)+'):\nממי קיבלת, למי העברת או על מה', t.note||'');
    if(v===null) return; const val = v.trim(); delete t.noteSrc; if(val) t.note = val; else delete t.note;
    recat(t); save(); render(); toast(val?'הפירוט נשמר ✓':'הפירוט נמחק'); return; }
  const mr = e.target.closest('[data-mkrule]');
  if(mr){ ruleId = ruleId==mr.dataset.mkrule ? null : +mr.dataset.mkrule; splitId = null; render(); return; }
  const dx = e.target.closest('[data-delx]');
  if(dx){ const r = db.xrules.find(x=>x.id==dx.dataset.delx); if(r && confirm('למחוק את הכלל? תנועות שכבר סווגו יישארו כמו שהן.')){ db.xrules = db.xrules.filter(x=>x!==r); save(); render(); } return; }
  const idl = e.target.closest('[data-impdel]');
  if(idl){ const i = db.imports.find(x=>x.id==idl.dataset.impdel); if(i && confirm(i.count ? `למחוק את כל ${i.count} התנועות שיובאו מ"${i.name}"? גם היתרה שנקלטה ממנו תימחק.` : `למחוק את הייבוא "${i.name}" ואת היתרה שנקלטה ממנו?`)){ db.tx = db.tx.filter(t=>t.imp!=i.id); db.imports = db.imports.filter(x=>x!==i);
    const B = db.balances[i.owner]; if(B && B.imp==i.id){ if(i.prevBal) db.balances[i.owner] = i.prevBal; else delete db.balances[i.owner]; } save(); curMonth=null; render(); toast('הייבוא נמחק'); } return; }
  const ap = e.target.closest('[data-annpreset]');
  if(ap){ $('#aName').value = ap.dataset.annpreset; $('#aMonth').value = ap.dataset.m; $('#aAmt').focus(); return; }
  const ad = e.target.closest('[data-anndel]');
  if(ad){ db.annual = db.annual.filter(a=>a.id!=ad.dataset.anndel); save(); render(); return; }
  const gd = e.target.closest('[data-goaldep],[data-goalwd]');
  if(gd){
    const id = gd.dataset.goaldep || gd.dataset.goalwd; const g = db.goals.find(x=>x.id==id); if(!g) return;
    const v = parseFloat($('#gdep'+id).value); if(!(v>0)){ toast('כתוב סכום'); return; }
    const before = goalSaved(g);
    g.deposits = g.deposits||[]; g.deposits.push({date:todayStr(), amount: gd.dataset.goalwd ? -v : v});
    const after = goalSaved(g);
    if(after < g.amount) g.celebrated = false;
    if(after < g.amount/2) g.half = false;
    save(); render();
    if(before < g.amount && after >= g.amount) toast('🎉 הגעת למטרה "'+g.name+'"!');
    else toast('נרשם ✓');
    return;
  }
  const gx = e.target.closest('[data-goaldel],[data-goalack],[data-goalhalf]');
  if(gx){
    const id = gx.dataset.goaldel || gx.dataset.goalack || gx.dataset.goalhalf; const g = db.goals.find(x=>x.id==id); if(!g) return;
    if(gx.dataset.goaldel){ if(!confirm(`למחוק את המטרה "${g.name}"?`)) return; db.goals = db.goals.filter(x=>x!==g); }
    else if(gx.dataset.goalack) g.celebrated = true; else g.half = true;
    save(); render(); return;
  }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='mprev'){ curMonth = addMonths(curMonth,-1); render(); }
  else if(act==='mnext'){ curMonth = addMonths(curMonth,1); render(); }
  else if(act==='addtx'){
    addOpen = true;
    const type = $('#fType').value, date = $('#fDate').value, description = $('#fDesc').value.trim(), amount = parseFloat($('#fAmt').value);
    if(!date || !description || !(amount>0)){ toast('צריך תאריך, תיאור וסכום'); return; }
    const category = $('#fCat').value;
    const t = {type, date, description, amount, category, owner:$('#fOwner').value};
    if(type==='income') t.exempt = $('#fEx').checked;
    if(category!=='אחר') db.rules[type+'|'+norm(description)] = category;
    addTx(t); save(); curMonth = ymOf(date); render(); toast('נוסף ✓');
  }
  else if(act==='doimport'){
    const list = imp.ready || [];
    const owner = $('#iOwner').value;
    const bal = latestBalance(); const oldB = db.balances[owner];
    // תנועות שכבר קיימות: משלימים להן את הפירוט מהקובץ, אם חסר
    const nEnrich = (imp.enrich||[]).length;
    (imp.enrich||[]).forEach(({x, note})=>{ x.note = note; x.noteSrc = 'file'; recat(x); });
    if(!owner){ toast('בחר של מי הקובץ'); return; }
    if(imp.acct){ db.settings.acctOwner = {...(db.settings.acctOwner||{}), [imp.acct]: owner}; }
    const impId = db.nextId++;
    const balChanged = bal && (!oldB || oldB.src==='manual' || bal.date >= oldB.date);
    if(balChanged) db.balances[owner] = {...bal, src:'file', imp: impId};
    if(!list.length && balChanged) db.imports.push({id:impId, name: imp.name, date: todayStr(), owner, count: 0, inc: 0, exp: 0, prevBal: oldB || null});
    if(!list.length){ save(); imp = null; toast(nEnrich ? `נוסף פירוט ל-${nEnrich} תנועות ✓` : 'היתרה עודכנה ✓'); document.querySelector('#nav button[data-tab="dash"]').click(); return; }
    db.imports.push({id:impId, prevBal: balChanged ? (oldB || null) : undefined, name: imp.name, date: todayStr(), owner, count: list.length,
      inc: list.filter(t=>t.type==='income').length, exp: list.filter(t=>t.type==='expense').length});
    // סדר התנועות באותו יום: לפי הסדר בקובץ (יש בנקים שממיינים מהחדש לישן)
    const desc = list.length>1 && list[0].date > list[list.length-1].date;
    list.forEach(t=>{ const c = {...t, owner, imp: impId, ord: desc ? -t.row : t.row}; delete c.row; addTx(c); });
    save();
    const ms = list.map(t=>ymOf(t.date)).sort(); if(ms.length) curMonth = ms[ms.length-1];
    imp = null; toast(`יובאו ${list.length} תנועות ✓${nEnrich?` ונוסף פירוט ל-${nEnrich}`:''}`);
    document.querySelector('#nav button[data-tab="dash"]').click();
  }
  else if(act==='adddon'){
    const date = $('#dDate').value, note = $('#dDesc').value.trim(), amount = parseFloat($('#dAmt').value), k = $('#dKind').value;
    if(!date || !(amount>0)){ toast('צריך תאריך וסכום'); return; }
    db.maaserManual.push({id:db.nextId++, date, note: note || (k==='given'?'תרומה':'תיקון ידני'), owner: $('#dOwner').value,
      kind: k==='given'?'given':'adjust', amount: k==='less' ? -amount : amount});
    save(); render(); toast(k==='given'?'התרומה נרשמה ✓':'החוב עודכן ✓');
  }
  else if(act==='addrule'){
    const match = $('#rMatch').value.trim(), kind = $('#rKind').value, value = parseFloat($('#rVal').value);
    if(!match){ toast('כתוב אילו מילים יופיעו בתיאור ההכנסה'); return; }
    if((kind==='pct'||kind==='fixed') && !(value>=0)){ toast(kind==='pct'?'כתוב כמה אחוז':'כתוב את הסכום'); return; }
    db.maaserRules = db.maaserRules.filter(r=>norm(r.match)!==norm(match));
    db.maaserRules.push({id:db.nextId++, match, kind, value: (kind==='pct'||kind==='fixed') ? value : undefined});
    save(); render(); toast('הכלל נשמר ✓');
  }
  else if(act==='goalcheck' || act==='goaladd'){
    const name = $('#gName').value.trim(), amount = parseFloat($('#gAmt').value), date = $('#gDate').value, have = parseFloat($('#gHave').value)||0;
    if(!name || !(amount>0)){ toast('כתוב מה וכמה זה עולה'); return; }
    const plan = planGoal(name, amount, date, have);
    if(act==='goaladd'){
      const g = {id:db.nextId++, name, amount, date: date||'', monthly: plan.monthly||0, deposits: have?[{date:todayStr(), amount:have}]:[], created: todayStr()};
      db.goals.push(g); save(); render(); toast('המטרה נשמרה ✓'); return;
    }
    $('#gPreview').innerHTML = `<h3>${esc(name)}: ${money(amount)}</h3>` + plan.lines.map(([k,t])=>`<div class="tip ${k}"><span>${t}</span></div>`).join('') +
      `<button class="btn primary" data-act="goaladd">שמור כמטרה ועקוב אחריה</button>`;
  }
  else if(act==='newtx'){ addOpen = true; txView = 'all'; document.querySelector('#nav button[data-tab="tx"]').click(); setTimeout(()=>{ const f = $('#fDesc'); if(f) f.focus(); }, 50); }
  else if(act==='marketcheck'){ marketCheck = marketCheck ? null : 'shown'; render(); }
  else if(act==='marketclose'){ marketCheck = null; render(); }
  else if(act==='marketsave'){
    const b = parseFloat($('#mBoi').value), i = parseFloat($('#mInf').value);
    if(!(b>=0 && b<20) || !(i>-5 && i<30)){ toast('צריך שני מספרים, למשל 3.25 ו-1.6'); return; }
    if(b===MARKET.boiRate && i===MARKET.inflation){ marketCheck = null; render(); toast('אין שינוי. הנתונים כבר מעודכנים ✓'); return; }
    db.settings.marketOverride = {boiRate:b, inflation:i, date: todayStr()};
    applyMarketOverride(); save(); marketCheck = null; render(); toast('מצב השוק עודכן ✓ ההמלצות חושבו מחדש');
  }
  else if(act==='marketreset'){ delete db.settings.marketOverride; applyMarketOverride(); save(); render(); toast('חזרנו לנתוני השוק שבקובץ'); }
  else if(act==='helphide'){ db.settings.helpMode = false; save(); render(); }
  else if(act==='helpshow'){ db.settings.helpMode = !db.settings.helpMode; save(); render(); window.scrollTo(0,0); }
  else if(act==='marketseen'){ db.settings.marketSeen = MARKET.updated; save(); render(); }
  else if(act==='assetnew'){ assetEdit = 'new'; render(); }
  else if(act==='assetcancel'){ assetEdit = null; render(); }
  else if(act==='assetsave'){
    const num = id => { const v = $('#'+id).value.trim(); return v==='' ? null : +v; };
    const kind = $('#aKind').value, amount = num('aAmt');
    if(amount===null){ toast('כתוב סכום'); return; }
    const a = assetEdit==='new' ? {id: db.nextId++} : db.assets.find(x=>x.id===assetEdit);
    Object.assign(a, {kind, name: $('#aName').value.trim() || ASSET_KINDS[kind].label, owner: $('#aOwner').value, amount,
      feeAcc: num('aAcc'), feeDep: num('aDep'), monthly: num('aMon'), equity: kind==='stocks' && num('aEq')===null ? 100 : num('aEq'), updated: todayStr()});
    if(assetEdit==='new') db.assets.push(a);
    assetEdit = null; save(); render(); toast('נשמר ✓');
  }
  else if(act==='baledit'){ balEdit = true; render(); }
  else if(act==='balcancel'){ balEdit = false; render(); }
  else if(act==='balsave'){
    document.querySelectorAll('[data-bal]').forEach(i=>{ const o = i.dataset.bal, v = i.value.trim();
      if(v==='') delete db.balances[o];
      else if(!db.balances[o] || +db.balances[o].amount !== +v) db.balances[o] = {amount:+v, date:todayStr(), src:'manual'}; });
    balEdit = false; save(); render(); toast('נשמר ✓');
  }
  else if(act==='nosplit'){ splitId = null; render(); }
  else if(act==='noxrule'){ ruleId = null; render(); }
  else if(act==='savexrule'){
    const t = db.tx.find(x=>x.id==ruleId); if(!t) return;
    const text = $('#rText').value.trim(), amtOn = $('#rAmtOn').checked;
    if(!norm(text) && !amtOn){ toast('צריך מילה מהתיאור או מהפירוט, או לסמן "רק כשהסכום בדיוק"'); return; }
    const r = {id:db.nextId++, type:t.type, text, amount: amtOn ? +(+(t.origAmount ?? t.amount)).toFixed(2) : null,
      category: $('#rCat').value, note: $('#rNote').value.trim() || undefined, maaser: ($('#rMaaser') && $('#rMaaser').value) || undefined};
    db.xrules = db.xrules.filter(x=>!(x.type===r.type && norm(x.text)===norm(r.text) && x.amount===r.amount));
    db.xrules.push(r);
    t.category = r.category; t.manualCat = true; if(r.note) t.note = r.note;
    const match = db.tx.filter(x=>x!==t && !x.splitOf && x.origAmount==null && xRuleMatch(r,x));
    const manual = match.filter(x=>x.manualCat && x.category!==r.category);
    const force = manual.length && confirm(`יש ${manual.length} תנועות מתאימות שכבר שינית להן קטגוריה ידנית. לשנות גם אותן ל"${r.category}"?`);
    let n = 0; match.forEach(x=>{ if(findXRule(x)===r && applyXRule(x, force)) n++; });
    ruleId = null; save(); render(); toast(`הכלל נשמר ✓${n?` ועודכנו עוד ${n} תנועות`:''}`);
  }
  else if(act==='dosplit'){
    const t = db.tx.find(x=>x.id==splitId); if(!t) return;
    const amt = Math.round(parseFloat($('#spAmt').value)*100)/100, cat = $('#spCat').value;
    if(!(amt>0) || amt > t.amount){ toast(`כתוב סכום בין 0 ל-${money(t.amount)}`); return; }
    if(t.origAmount===undefined) t.origAmount = t.amount;
    if(amt === t.amount){ t.category = cat; t.manualCat = true; }
    else {
      t.amount = Math.round((t.amount - amt)*100)/100;
      const part = {type:t.type, date:t.date, description:t.description, amount:amt, category:cat, manualCat:true, owner:t.owner, splitOf:t.id};
      if(t.imp) part.imp = t.imp;
      addTx(part);
    }
    splitId = null; save(); render(); toast('פוצל ✓');
  }
  else if(act==='carsave'){ db.settings.carInsAnnual = parseFloat($('#carAnnual').value)||0; save(); render(); }
  else if(act==='budgetsave'){
    document.querySelectorAll('[data-budget]').forEach(i=>{ const v = parseFloat(i.value); if(v>0) db.budgets[i.dataset.budget] = v; else delete db.budgets[i.dataset.budget]; });
    save(); render(); toast('התקציב נשמר ✓');
  }
  else if(act==='budgetsuggest'){
    const D = dataProfile(); if(!D){ toast('אין עדיין מספיק נתונים'); return; }
    document.querySelectorAll('[data-budget]').forEach(i=>{ const v = D.catAvg[i.dataset.budget]; if(v && !i.value) i.value = Math.ceil(v/50)*50; });
    toast('מילאתי לפי הממוצע. אפשר לשנות ואז ללחוץ "שמור תקציב"');
  }
  else if(act==='annadd'){
    const name = $('#aName').value.trim(), month = +$('#aMonth').value, amount = parseFloat($('#aAmt').value);
    if(!name || !(amount>0)){ toast('כתוב מה וכמה'); return; }
    db.annual.push({id:db.nextId++, name, month, amount}); save(); render(); toast('נוסף ✓');
  }
  else if(act==='summaryseen'){ db.settings.summarySeen = addMonths(todayStr().slice(0,7),-1); save(); render(); }
  else if(act==='moveowner'){
    const from = $('#mvFrom').value, to = $('#mvTo').value;
    if(from===to){ toast('בחר שני חשבונות שונים'); return; }
    const n = db.tx.filter(t=>(t.owner||JOINT)===from).length;
    if(!confirm(`להעביר ${n} תנועות וכל השאר מ"${from}" ל"${to}"?`)) return;
    const mv = o => (o||JOINT)===from;
    db.tx.forEach(t=>{ if(mv(t.owner)) t.owner = to; });
    [db.imports, db.assets, db.maaserManual].forEach(list=>list.forEach(x=>{ if(mv(x.owner)) x.owner = to; }));
    renameOwners([from],[to]);
    save(); render(); toast(`הועברו ${n} תנועות ✓`);
  }
  else if(act==='addperson'){
    let n = db.settings.people.length+1; while(db.settings.people.includes('חשבון '+n)) n++;
    db.settings.people.push('חשבון '+n); save(); render();
    const el = document.querySelector(`[data-person="${db.settings.people.length-1}"]`); if(el){ el.focus(); el.select(); }
  }
  else if(act==='savepeople'){
    const old = [...db.settings.people];
    const nw = old.map((o,i)=>{ const el = document.querySelector(`[data-person="${i}"]`); return (el && el.value.trim()) || o; });
    if(new Set(nw).size !== nw.length || nw.includes(JOINT)){ toast('כל חשבון צריך שם אחר'); return; }
    renameOwners(old, nw); db.settings.people = nw; save(); render(); toast('נשמר ✓');
  }
  else if(act==='savemaaser'){
    db.settings.maaserPct = Math.max(0, Math.min(100, parseFloat($('#sPct').value)||0));
    db.settings.maaserOpening = parseFloat($('#sOpen').value)||0;
    save(); render(); toast('נשמר ✓');
  }
  else if(act==='saveprofile'){
    ['savings','debt','age','kids'].forEach(k=>{ const v = $('#'+k).value; db.profile[k] = v===''?(k==='savings'?0:undefined):+v; });
    ['work','hish','risk','horizon'].forEach(k=>db.profile[k] = $('#'+k).value);
    save(); render();
  }
  else if(act==='export'){
    const blob = new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = 'גיבוי-ניהול-כסף-'+todayStr()+'.json';
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
    db.settings.lastBackup = todayStr(); save();
    toast('קובץ הגיבוי נשמר בתיקיית ההורדות');
  }
  else if(act==='demo'){ loadDemo(); }
  else if(act==='cleardemo'){ db.tx = db.tx.filter(t=>!t.demo); save(); curMonth=null; render(); toast('נתוני הדוגמה נמחקו'); }
  else if(act==='clearall'){
    if(confirm('למחוק את כל הנתונים? אי אפשר לבטל. (מומלץ לשמור גיבוי קודם)') && confirm('בטוח? כל התנועות וההגדרות יימחקו.')){ db = emptyDb(); save(); curMonth=null; render(); toast('הכל נמחק'); }
  }
});
document.addEventListener('change', async e=>{
  if(e.target.id==='aKind'){ toggleFeeFields(); return; }
  if(['fMon','fStart','fYears'].includes(e.target.id)){ fut.monthly = Math.max(0, +$('#fMon').value||0); fut.start = Math.max(0, +$('#fStart').value||0); fut.years = +$('#fYears').value; render(); return; }
  if(e.target.id==='sMode'){ if(e.target.value!=='other') $('#sPct').value = e.target.value; else $('#sPct').focus(); return; }
  const el = e.target;
  if(el.dataset.cat){
    const t = db.tx.find(x=>x.id==el.dataset.cat); if(!t) return;
    const old = t.category; t.category = el.value;
    const n = norm(t.description);
    t.manualCat = true;
    if(t.note && norm(t.note)){
      // לומדים לפי השם שבפירוט: כל העברה מ/אל אותו אדם תסווג כך
      const nn = norm(t.note); db.rules[t.type+'|n:'+nn] = el.value;
      const same = db.tx.filter(x=>x!==t && x.type===t.type && norm(x.note)===nn && !x.manualCat && x.category!==el.value);
      same.forEach(x=>x.category=el.value);
      save(); toast(`נשמר. מעכשיו כל מה ש"${t.note}" יסווג כ"${el.value}"${same.length?` (עודכנו עוד ${same.length})`:''}`); if(same.length) render(); return;
    }
    if(isGeneric(t)){ save(); toast('נשמר. כדי שהעברה כזו תסווג לבד בפעם הבאה, לחץ ⚙ ליד התנועה'); return; }
    db.rules[t.type+'|'+n] = el.value;
    // כל התנועות מאותו מקום (גם מייבואים קודמים), חוץ ממה שכבר שינית ידנית
    const same = db.tx.filter(x=>x!==t && x.type===t.type && norm(x.description)===n && !x.manualCat && x.category!==el.value);
    if(same.length && confirm(`יש עוד ${same.length} תנועות של "${t.description}" (גם מייבואים קודמים). לשנות גם אותן ל"${el.value}"?`)) same.forEach(x=>x.category=el.value);
    save(); toast('נשמר. מעכשיו אזהה את זה לבד'); if(same.length) render();
  }
  else if(el.dataset.ex){
    const t = db.tx.find(x=>x.id==el.dataset.ex); if(!t) return;
    setMaaserKind(t, el.checked ? 'exempt' : 'normal');
  }
  else if(el.id==='fType'){ $('#fCat').innerHTML = catOptions(el.value, guessCategory($('#fDesc').value, el.value)); $('#fExWrap').classList.toggle('hidden', el.value!=='income'); }
  else if(el.id==='fCat' && $('#fType').value==='income'){ $('#fEx').checked = EXEMPT_BY_DEFAULT.has(el.value); }
  else if(el.dataset.owner){
    const t = db.tx.find(x=>x.id==el.dataset.owner); if(!t) return;
    t.owner = el.value; save(); toast('נשמר');
  }
  else if(el.id==='tOwner'){ txFilter.owner = el.value; render(); }
  else if(el.dataset.mk){
    const t = db.tx.find(x=>x.id==el.dataset.mk); if(!t) return;
    setMaaserKind(t, el.value);
  }
  else if(el.id==='tType'){ txFilter.type = el.value; render(); }
  else if(el.id==='mergeFile'){
    const f = el.files[0]; if(!f) return;
    let d; try{ d = migrate(JSON.parse(await f.text())); if(!Array.isArray(d.tx)) throw 0; }catch(err){ alert('הקובץ הזה לא נראה כמו גיבוי של התוכנה.'); return; }
    const keyO = t => txKey(t)+'|'+(t.owner||JOINT);
    const have = new Set(db.tx.map(keyO));
    let added = 0;
    for(const t of d.tx){ if(t.demo || have.has(keyO(t))) continue; const c = {...t}; delete c.id; c.id = db.nextId++; db.tx.push(c); have.add(keyO(c)); added++; if(c.owner && !ownerList().includes(c.owner)) db.settings.people.push(c.owner); }
    for(const [k,v] of Object.entries(d.rules||{})) if(!db.rules[k]) db.rules[k] = v;
    for(const x of d.maaserManual||[]) if(!db.maaserManual.some(y=>y.date===x.date && +y.amount===+x.amount && y.kind===x.kind && y.note===x.note)) db.maaserManual.push({...x, id:db.nextId++});
    for(const [o,b] of Object.entries(d.balances||{})) if(!db.balances[o] || (b.date||'') > (db.balances[o].date||'')) db.balances[o] = b;
    for(const a of d.assets||[]){ const m = db.assets.find(x=>x.kind===a.kind && norm(x.name)===norm(a.name) && x.owner===a.owner);
      if(!m) db.assets.push({...a, id:db.nextId++}); else if((a.updated||'') > (m.updated||'')) Object.assign(m, {...a, id:m.id}); }
    for(const r of d.maaserRules||[]) if(!db.maaserRules.some(x=>norm(x.match)===norm(r.match))) db.maaserRules.push({...r, id:db.nextId++});
    for(const r of d.xrules||[]) if(!db.xrules.some(x=>x.type===r.type && norm(x.text)===norm(r.text) && x.amount===r.amount)) db.xrules.push({...r, id:db.nextId++});
    save(); curMonth=null; render(); toast(`נוספו ${added} תנועות חדשות ✓`);
    el.value='';
  }
  else if(el.id==='restore'){
    const f = el.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!d || !Array.isArray(d.tx)) throw 0;
      if(db.tx.length && !confirm(`השחזור יחליף את ${db.tx.length} התנועות הנוכחיות ב-${d.tx.length} תנועות מהגיבוי. להמשיך?`)) return;
      db = migrate(d); save(); curMonth=null; render(); toast('הגיבוי שוחזר ✓');
    }catch(err){ alert('הקובץ הזה לא נראה כמו גיבוי של התוכנה.'); }
  }
});
document.addEventListener('toggle', e=>{ if(e.target.id==='addCard') addOpen = e.target.open; }, true);
document.addEventListener('input', e=>{
  if(e.target.id==='fDesc'){ const type = $('#fType').value; const c = guessCategory(e.target.value, type); $('#fCat').value = c; if(type==='income') $('#fEx').checked = guessExempt(e.target.value, c); }
  else if(e.target.id==='tQ'){ txFilter.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#tQ'); q.focus(); q.setSelectionRange(pos,pos); }
});

function setMaaserKind(t, kind){
  let value;
  if(kind==='pct'){ value = parseFloat(prompt(`כמה אחוז מעשרות לתת מ"${t.description}"?`, '10')); if(isNaN(value)){ render(); return; } }
  if(kind==='fixed'){ value = parseFloat(prompt(`איזה סכום קבוע (₪) לתת בכל פעם שנכנסת הכנסה מ"${t.description}"?`, '')); if(isNaN(value)){ render(); return; } }
  const n = norm(t.description);
  const same = db.tx.filter(x=>x!==t && x.type==='income' && norm(x.description).includes(n));
  if(confirm(`לקבוע את זה ככלל קבוע לכל הכנסה מ"${t.description}"${same.length?` (כולל ${same.length} שכבר קיימות)`:''}, וגם להכנסות כאלה בעתיד?\n\nאישור = כלל קבוע · ביטול = רק להכנסה הזו`)){
    db.maaserRules = db.maaserRules.filter(r=>norm(r.match)!==n);
    db.maaserRules.push({id:db.nextId++, match:t.description, kind, value});
    [t, ...same].forEach(x=>{ delete x.mk; delete x.mv; });
    toast('הכלל נשמר ✓ מעכשיו אחשב את זה לבד');
  } else { t.mk = kind; t.mv = value; }
  save(); render();
}

  const D = (k, day) => addMonths(base, k) + '-' + String(day).padStart(2,'0');
  for(let k=-3;k<=0;k++){
    const list = [
      ['income',1,'משכורת - חברת אלפא',12800],['income',10,'ביטוח לאומי קצבת ילדים',520],
      ['expense',2,'שכר דירה',4900],['expense',3,'שופרסל דיל',640+k*-30],['expense',9,'רמי לוי',530],['expense',17,'שופרסל דיל',420],['expense',24,'מכולת השכונה',180],
      ['expense',5,'פרטנר תקשורת',99],['expense',5,'הוט אינטרנט',129],['expense',6,'NETFLIX.COM',55],['expense',6,'Spotify',23],['expense',7,'דיסני פלוס',40],
      ['expense',8,'חברת החשמל',380],['expense',12,'פז דלק',310],['expense',12,'ביטוח רכב הראל',230],['expense',14,'מגדל ביטוח בריאות',160],
      ['expense',15,'סופר פארם',140],['expense',18,'ארומה',62],['expense',20,'עמלת פעולה',12],['expense',11,'נדרים פלוס - ישיבת אור',600],['expense',26,'קופת העיר',300],
      ['expense',22,'חדר כושר מנוי',189],
    ];
    if(k===-1) list.push(['income',20,'החזר הוצאות מהעבודה',850]);
    if(k===0) list.push(['expense',13,'פז דלק',310],['expense',21,'חנות אלקטרוניקה KSP',1450],['expense',23,'וולט משלוחים',140],['expense',27,'וולט משלוחים',165]);
    list.forEach(([type,day,description,amount])=>{
      const date = D(k, Math.min(day,28));
      if(k===0 && date>todayStr()) return;
      addTx({type,date,description,amount,demo:true});
    });
  }
  save(); curMonth=null; render(); toast('נטענו נתוני דוגמה');
}

render();
